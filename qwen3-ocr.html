    <!-- Toast Container -->
    <div class="toast-container" id="toastContainer"></div>

    <!-- Hidden File Input -->
    <input type="file" id="fileInput" class="file-input" accept="image/*,.pdf" multiple>

    <!-- PDF.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

    <script>
        // ==================== App State ====================
        const state = {
            images: [], // { id, canvas, originalFile, rotation, thumbnail }
            currentIndex: -1,
            zoom: 1,
            rotation: 0,
            isSelecting: false,
            selectionStart: null,
            selectionRect: null,
            currentMode: 'text',
            settings: {
                apiEndpoint: 'http://localhost:1234/v1/chat/completions',
                model: 'qwen3-vl-8b-instruct',
                customModel: '',
                temperature: 0.1,
                maxTokens: 4096,
                maxResolution: 2048,
                imageQuality: 0.85
            },
            history: [],
            lastResult: '',
            isOnline: false,
            // PDF page selection state
            pendingPdf: null,
            pdfNumPages: 0,
            selectedPdfPages: new Set(),
            availableModels: []
        };

        // ==================== DOM Elements ====================
        const $ = (sel) => document.querySelector(sel);
        const $$ = (sel) => document.querySelectorAll(sel);

        const elements = {
            dropZone: $('#dropZone'),
            imageCanvas: $('#imageCanvas'),
            imageContainer: $('#imageContainer'),
            selectionBox: $('#selectionBox'),
            thumbnailsBar: $('#thumbnailsBar'),
            resultContent: $('#resultContent'),
            fileInput: $('#fileInput'),
            settingsModal: $('#settingsModal'),
            historyModal: $('#historyModal'),
            cameraModal: $('#cameraModal'),
            urlModal: $('#urlModal'),
            pdfPageModal: $('#pdfPageModal'),
            imageLoading: $('#imageLoading'),
            resultLoading: $('#resultLoading'),
            zoomIndicator: $('#zoomIndicator'),
            toastContainer: $('#toastContainer'),
            headerModelSelect: $('#headerModelSelect'),
            pageRangeGrid: $('#pageRangeGrid')
        };

        // ==================== Initialization ====================
        document.addEventListener('DOMContentLoaded', init);

        async function init() {
            loadSettings();
            loadHistory();
            setupEventListeners();
            checkConnection();
            setupPWA();

            // Auto-load model list on startup
            await refreshHeaderModelList();

            // Check connection periodically
            setInterval(checkConnection, 30000);
        }

        // ==================== Settings ====================
        function loadSettings() {
            const saved = localStorage.getItem('qwen-ocr-settings');
            if (saved) {
                Object.assign(state.settings, JSON.parse(saved));
            }
            applySettings();
        }

        function applySettings() {
            $('#apiEndpoint').value = state.settings.apiEndpoint;
            $('#customModel').value = state.settings.customModel || '';
            $('#temperature').value = state.settings.temperature;
            $('#tempValue').textContent = state.settings.temperature;
            $('#maxTokens').value = state.settings.maxTokens;
            $('#maxTokensValue').textContent = state.settings.maxTokens;
            $('#maxResolution').value = state.settings.maxResolution;
            $('#imageQuality').value = state.settings.imageQuality;
            $('#qualityValue').textContent = Math.round(state.settings.imageQuality * 100) + '%';

            // Sync header model selector
            if (elements.headerModelSelect) {
                elements.headerModelSelect.value = state.settings.model || 'qwen3-vl-8b-instruct';
            }
        }

        function saveSettings() {
            state.settings.apiEndpoint = $('#apiEndpoint').value;
            state.settings.model = $('#modelSelect').value || state.settings.model;
            state.settings.customModel = $('#customModel').value;
            state.settings.temperature = parseFloat($('#temperature').value);
            state.settings.maxTokens = parseInt($('#maxTokens').value);
            state.settings.maxResolution = parseInt($('#maxResolution').value);
            state.settings.imageQuality = parseFloat($('#imageQuality').value);

            // Sync header model selector
            elements.headerModelSelect.value = state.settings.model;

            localStorage.setItem('qwen-ocr-settings', JSON.stringify(state.settings));
            showToast('設定已儲存', 'success');
            elements.settingsModal.classList.remove('visible');
        }

        // ==================== Event Listeners ====================
        function setupEventListeners() {
            // File handling
            elements.dropZone.addEventListener('click', () => elements.fileInput.click());
            elements.dropZone.addEventListener('dragover', handleDragOver);
            elements.dropZone.addEventListener('dragleave', handleDragLeave);
            elements.dropZone.addEventListener('drop', handleDrop);
            elements.fileInput.addEventListener('change', handleFileSelect);

            // Paste
            document.addEventListener('paste', handlePaste);

            // Toolbar buttons
            $('#openFile').addEventListener('click', () => elements.fileInput.click());
            $('#pasteImage').addEventListener('click', () => showToast('請使用 Ctrl+V 貼上圖片', 'info'));
            $('#cameraCapture').addEventListener('click', openCamera);
            $('#loadUrl').addEventListener('click', () => elements.urlModal.classList.add('visible'));

            $('#rotateLeft').addEventListener('click', () => rotateImage(-90));
            $('#rotateRight').addEventListener('click', () => rotateImage(90));
            $('#zoomIn').addEventListener('click', () => setZoom(state.zoom * 1.25));
            $('#zoomOut').addEventListener('click', () => setZoom(state.zoom * 0.8));
            $('#zoomFit').addEventListener('click', () => setZoom(1));

            $('#selectRegion').addEventListener('click', toggleSelectionMode);
            $('#clearSelection').addEventListener('click', clearSelection);
            $('#clearAll').addEventListener('click', clearAll);

            // Canvas interaction
            elements.imageCanvas.addEventListener('mousedown', startSelection);
            elements.imageCanvas.addEventListener('mousemove', updateSelection);
            elements.imageCanvas.addEventListener('mouseup', endSelection);

            // Mode buttons
            $$('.mode-btn').forEach(btn => {
                btn.addEventListener('click', () => setMode(btn.dataset.mode));
            });

            // Result tabs
            $$('.result-tab').forEach(tab => {
                tab.addEventListener('click', () => switchTab(tab.dataset.tab));
            });

            // Result actions
            $('#copyResult').addEventListener('click', copyResult);
            $('#exportTxt').addEventListener('click', () => exportResult('txt'));
            $('#exportMd').addEventListener('click', () => exportResult('md'));
            $('#exportJson').addEventListener('click', () => exportResult('json'));
            $('#exportCsv').addEventListener('click', () => exportResult('csv'));
            $('#clearResult').addEventListener('click', clearResult);

            // Settings
            $('#settingsBtn').addEventListener('click', () => {
                elements.settingsModal.classList.add('visible');
                refreshModelList();
            });
            $('#closeSettings').addEventListener('click', () => elements.settingsModal.classList.remove('visible'));
            $('#saveSettings').addEventListener('click', saveSettings);
            $('#resetSettings').addEventListener('click', resetSettings);
            $('#refreshModels').addEventListener('click', refreshModelList);

            $('#temperature').addEventListener('input', (e) => $('#tempValue').textContent = e.target.value);
            $('#maxTokens').addEventListener('input', (e) => $('#maxTokensValue').textContent = e.target.value);
            $('#imageQuality').addEventListener('input', (e) => $('#qualityValue').textContent = Math.round(e.target.value * 100) + '%');

            // History
            $('#historyBtn').addEventListener('click', () => {
                renderHistoryList();
                elements.historyModal.classList.add('visible');
            });
            $('#closeHistory').addEventListener('click', () => elements.historyModal.classList.remove('visible'));
            $('#clearHistory').addEventListener('click', clearHistoryData);

            // Camera
            $('#closeCamera').addEventListener('click', closeCamera);
            $('#cancelCamera').addEventListener('click', closeCamera);
            $('#capturePhoto').addEventListener('click', capturePhoto);

            // URL
            $('#closeUrl').addEventListener('click', () => elements.urlModal.classList.remove('visible'));
            $('#cancelUrl').addEventListener('click', () => elements.urlModal.classList.remove('visible'));
            $('#loadImageUrl').addEventListener('click', loadFromUrl);

            // Theme
            $('#themeToggle').addEventListener('click', toggleTheme);

            // Start OCR
            $('#startOCR').addEventListener('click', startOCR);

            // Header Model Selector
            elements.headerModelSelect.addEventListener('change', (e) => {
                state.settings.model = e.target.value;
                localStorage.setItem('qwen-ocr-settings', JSON.stringify(state.settings));
                showToast(`已切換模型: ${e.target.value}`, 'success');
            });
            $('#headerRefreshModels').addEventListener('click', refreshHeaderModelList);

            // PDF Page Range Modal
            $('#closePdfPage').addEventListener('click', closePdfPageModal);
            $('#cancelPdfPage').addEventListener('click', closePdfPageModal);
            $('#confirmPdfPages').addEventListener('click', confirmPdfPages);
            $('#applyPageRange').addEventListener('click', applyPageRange);
            $('#selectAllPages').addEventListener('click', () => selectPdfPages('all'));
            $('#selectNonePages').addEventListener('click', () => selectPdfPages('none'));
            $('#selectOddPages').addEventListener('click', () => selectPdfPages('odd'));
            $('#selectEvenPages').addEventListener('click', () => selectPdfPages('even'));
            $('#selectFirst10').addEventListener('click', () => selectPdfPages('first10'));

            // Keyboard shortcuts
            document.addEventListener('keydown', handleKeyboard);
        }

        // ==================== File Handling ====================
        function handleDragOver(e) {
            e.preventDefault();
            elements.dropZone.classList.add('active');
        }

        function handleDragLeave(e) {
            e.preventDefault();
            elements.dropZone.classList.remove('active');
        }

        function handleDrop(e) {
            e.preventDefault();
            elements.dropZone.classList.remove('active');
            const files = Array.from(e.dataTransfer.files);
            processFiles(files);
        }

        function handleFileSelect(e) {
            const files = Array.from(e.target.files);
            processFiles(files);
            e.target.value = '';
        }

        function handlePaste(e) {
            const items = Array.from(e.clipboardData.items);
            for (const item of items) {
                if (item.type.startsWith('image/')) {
                    const file = item.getAsFile();
                    processFiles([file]);
                    break;
                }
            }
        }

        async function processFiles(files) {
            elements.imageLoading.classList.add('visible');

            for (const file of files) {
                if (file.type === 'application/pdf') {
                    await processPDF(file);
                } else if (file.type.startsWith('image/')) {
                    await processImage(file);
                }
            }

            elements.imageLoading.classList.remove('visible');

            if (state.images.length > 0 && state.currentIndex === -1) {
                selectImage(0);
            }
        }

        async function processImage(file, pageNum = null) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.onload = async (e) => {
                    const img = new Image();
                    img.onload = async () => {
                        const processed = await preprocessImage(img);
                        const id = Date.now() + Math.random();
                        const thumbnail = createThumbnail(processed);

                        state.images.push({
                            id,
                            canvas: processed,
                            originalFile: file,
                            rotation: 0,
                            thumbnail,
                            pageNum
                        });

                        renderThumbnails();
                        elements.dropZone.classList.add('hidden');
                        resolve();
                    };
                    img.src = e.target.result;
                };
                reader.readAsDataURL(file);
            });
        }

        async function processPDF(file) {
            const arrayBuffer = await file.arrayBuffer();
            const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
            const numPages = pdf.numPages;

            // Store PDF info for later processing
            state.pendingPdf = { file, pdf, arrayBuffer };
            state.pdfNumPages = numPages;
            state.selectedPdfPages = new Set();

            // Update modal info
            $('#pdfFileName').textContent = file.name;
            $('#pdfTotalPages').textContent = numPages;
            $('#pdfStartPage').value = 1;
            $('#pdfStartPage').max = numPages;
            $('#pdfEndPage').value = numPages;
            $('#pdfEndPage').max = numPages;

            // Generate page selection grid
            renderPdfPageGrid(numPages);

            // Select all pages by default
            selectPdfPages('all');

            // Show modal
            elements.imageLoading.classList.remove('visible');
            elements.pdfPageModal.classList.add('visible');
        }

        function renderPdfPageGrid(numPages) {
            const grid = elements.pageRangeGrid;
            grid.innerHTML = '';

            for (let i = 1; i <= numPages; i++) {
                const pageDiv = document.createElement('div');
                pageDiv.className = 'page-checkbox';
                pageDiv.textContent = i;
                pageDiv.dataset.page = i;

                pageDiv.addEventListener('click', () => {
                    pageDiv.classList.toggle('selected');
                    if (pageDiv.classList.contains('selected')) {
                        state.selectedPdfPages.add(i);
                    } else {
                        state.selectedPdfPages.delete(i);
                    }
                    updateSelectedPageCount();
                });

                grid.appendChild(pageDiv);
            }
        }

        function selectPdfPages(mode) {
            const pageCheckboxes = $$('.page-checkbox');
            state.selectedPdfPages.clear();

            pageCheckboxes.forEach((checkbox, index) => {
                const pageNum = index + 1;
                let shouldSelect = false;

                switch (mode) {
                    case 'all':
                        shouldSelect = true;
                        break;
                    case 'none':
                        shouldSelect = false;
                        break;
                    case 'odd':
                        shouldSelect = pageNum % 2 === 1;
                        break;
                    case 'even':
                        shouldSelect = pageNum % 2 === 0;
                        break;
                    case 'first10':
                        shouldSelect = pageNum <= 10;
                        break;
                }

                checkbox.classList.toggle('selected', shouldSelect);
                if (shouldSelect) {
                    state.selectedPdfPages.add(pageNum);
                }
            });

            updateSelectedPageCount();
        }

        function applyPageRange() {
            const start = parseInt($('#pdfStartPage').value) || 1;
            const end = parseInt($('#pdfEndPage').value) || state.pdfNumPages;

            const pageCheckboxes = $$('.page-checkbox');
            state.selectedPdfPages.clear();

            pageCheckboxes.forEach((checkbox, index) => {
                const pageNum = index + 1;
                const shouldSelect = pageNum >= start && pageNum <= end;

                checkbox.classList.toggle('selected', shouldSelect);
                if (shouldSelect) {
                    state.selectedPdfPages.add(pageNum);
                }
            });

            updateSelectedPageCount();
        }

        function updateSelectedPageCount() {
            $('#selectedPageCount').textContent = state.selectedPdfPages.size;
        }

        function closePdfPageModal() {
            elements.pdfPageModal.classList.remove('visible');
            state.pendingPdf = null;
            state.pdfNumPages = 0;
            state.selectedPdfPages.clear();
        }

        async function confirmPdfPages() {
            if (state.selectedPdfPages.size === 0) {
                showToast('請至少選擇一個頁面', 'error');
                return;
            }

            elements.pdfPageModal.classList.remove('visible');
            elements.imageLoading.classList.add('visible');

            const { file, pdf } = state.pendingPdf;
            const numPages = state.pdfNumPages;
            const selectedPages = Array.from(state.selectedPdfPages).sort((a, b) => a - b);

            try {
                for (const pageNum of selectedPages) {
                    const page = await pdf.getPage(pageNum);
                    const scale = 2;
                    const viewport = page.getViewport({ scale });

                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    canvas.width = viewport.width;
                    canvas.height = viewport.height;

                    await page.render({
                        canvasContext: ctx,
                        viewport: viewport
                    }).promise;

                    // Convert to image and process
                    const img = new Image();
                    await new Promise((resolve) => {
                        img.onload = resolve;
                        img.src = canvas.toDataURL('image/png');
                    });

                    const processed = await preprocessImage(img);
                    const id = Date.now() + Math.random();
                    const thumbnail = createThumbnail(processed);

                    state.images.push({
                        id,
                        canvas: processed,
                        originalFile: file,
                        rotation: 0,
                        thumbnail,
                        pageNum: pageNum,
                        totalPages: numPages
                    });
                }

                renderThumbnails();
                elements.dropZone.classList.add('hidden');

                if (state.images.length > 0 && state.currentIndex === -1) {
                    selectImage(0);
                }

                showToast(`已載入 ${selectedPages.length} 頁`, 'success');

            } catch (error) {
                showToast('PDF 處理失敗: ' + error.message, 'error');
            } finally {
                elements.imageLoading.classList.remove('visible');
                state.pendingPdf = null;
                state.pdfNumPages = 0;
                state.selectedPdfPages.clear();
            }
        }

        async function preprocessImage(img) {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');

            let width = img.width;
            let height = img.height;

            const maxRes = state.settings.maxResolution;
            if (maxRes > 0 && (width > maxRes || height > maxRes)) {
                const ratio = Math.min(maxRes / width, maxRes / height);
                width = Math.round(width * ratio);
                height = Math.round(height * ratio);
            }

            canvas.width = width;
            canvas.height = height;
            ctx.drawImage(img, 0, 0, width, height);

            // Update image info
            $('#imageInfo').textContent = `圖片: ${width}×${height}`;

            return canvas;
        }

        function createThumbnail(canvas) {
            const thumb = document.createElement('canvas');
            const ctx = thumb.getContext('2d');
            const size = 48;
            const ratio = Math.min(size / canvas.width, size / canvas.height);

            thumb.width = canvas.width * ratio;
            thumb.height = canvas.height * ratio;
            ctx.drawImage(canvas, 0, 0, thumb.width, thumb.height);

            return thumb.toDataURL('image/jpeg', 0.7);
        }

        // ==================== Image Display ====================
        function selectImage(index) {
            if (index < 0 || index >= state.images.length) return;

            state.currentIndex = index;
            state.zoom = 1;
            state.rotation = state.images[index].rotation;

            renderCurrentImage();
            updateThumbnailSelection();
        }

        function renderCurrentImage() {
            if (state.currentIndex < 0) return;

            const imgData = state.images[state.currentIndex];
            const canvas = elements.imageCanvas;
            const ctx = canvas.getContext('2d');
            const srcCanvas = imgData.canvas;

            // Apply rotation
            const rotation = state.rotation;
            const isRotated = rotation === 90 || rotation === 270;

            if (isRotated) {
                canvas.width = srcCanvas.height;
                canvas.height = srcCanvas.width;
            } else {
                canvas.width = srcCanvas.width;
                canvas.height = srcCanvas.height;
            }

            ctx.save();
            ctx.translate(canvas.width / 2, canvas.height / 2);
            ctx.rotate((rotation * Math.PI) / 180);
            ctx.drawImage(srcCanvas, -srcCanvas.width / 2, -srcCanvas.height / 2);
            ctx.restore();

            // Apply zoom
            canvas.style.transform = `scale(${state.zoom})`;
            elements.zoomIndicator.textContent = Math.round(state.zoom * 100) + '%';
            elements.zoomIndicator.style.display = 'block';

            // Update info
            const img = state.images[state.currentIndex];
            $('#imageInfo').textContent = `圖片: ${canvas.width}×${canvas.height}${img.pageNum ? ` (頁 ${img.pageNum}/${img.totalPages})` : ''}`;
        }

        function renderThumbnails() {
            elements.thumbnailsBar.innerHTML = '';

            state.images.forEach((img, index) => {
                const wrapper = document.createElement('div');
                wrapper.className = 'thumbnail-wrapper';

                const thumb = document.createElement('img');
                thumb.className = 'thumbnail' + (index === state.currentIndex ? ' active' : '');
                thumb.src = img.thumbnail;
                thumb.addEventListener('click', () => selectImage(index));

                const closeBtn = document.createElement('button');
                closeBtn.className = 'thumbnail-close';
                closeBtn.textContent = '×';
                closeBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    removeImage(index);
                });

                wrapper.appendChild(thumb);
                wrapper.appendChild(closeBtn);

                if (img.pageNum) {
                    const indicator = document.createElement('div');
                    indicator.className = 'page-indicator';
                    indicator.textContent = img.pageNum;
                    wrapper.appendChild(indicator);
                }

                elements.thumbnailsBar.appendChild(wrapper);
            });
        }

        function updateThumbnailSelection() {
            $$('.thumbnail').forEach((thumb, index) => {
                thumb.classList.toggle('active', index === state.currentIndex);
            });
        }

        function removeImage(index) {
            state.images.splice(index, 1);

            if (state.images.length === 0) {
                state.currentIndex = -1;
                elements.dropZone.classList.remove('hidden');
                elements.imageCanvas.getContext('2d').clearRect(0, 0, elements.imageCanvas.width, elements.imageCanvas.height);
                elements.zoomIndicator.style.display = 'none';
            } else if (state.currentIndex >= state.images.length) {
                selectImage(state.images.length - 1);
            } else if (state.currentIndex === index) {
                selectImage(Math.min(index, state.images.length - 1));
            }

            renderThumbnails();
        }

        // ==================== Image Manipulation ====================
        function rotateImage(degrees) {
            if (state.currentIndex < 0) return;

            state.rotation = (state.rotation + degrees + 360) % 360;
            state.images[state.currentIndex].rotation = state.rotation;
            renderCurrentImage();
        }

        function setZoom(zoom) {
            state.zoom = Math.max(0.25, Math.min(4, zoom));
            if (state.currentIndex >= 0) {
                elements.imageCanvas.style.transform = `scale(${state.zoom})`;
                elements.zoomIndicator.textContent = Math.round(state.zoom * 100) + '%';
            }
        }

        // ==================== Region Selection ====================
        function toggleSelectionMode() {
            state.isSelecting = !state.isSelecting;
            elements.imageCanvas.style.cursor = state.isSelecting ? 'crosshair' : 'default';
            $('#selectRegion').classList.toggle('active', state.isSelecting);
            if (!state.isSelecting) {
                clearSelection();
            }
        }

        function startSelection(e) {
            if (!state.isSelecting || state.currentIndex < 0) return;

            const rect = elements.imageCanvas.getBoundingClientRect();
            state.selectionStart = {
                x: (e.clientX - rect.left) / state.zoom,
                y: (e.clientY - rect.top) / state.zoom
            };

            elements.selectionBox.style.display = 'block';
        }

        function updateSelection(e) {
            if (!state.selectionStart) return;

            const rect = elements.imageCanvas.getBoundingClientRect();
            const canvasRect = elements.imageContainer.getBoundingClientRect();

            const currentX = (e.clientX - rect.left) / state.zoom;
            const currentY = (e.clientY - rect.top) / state.zoom;

            const left = Math.min(state.selectionStart.x, currentX);
            const top = Math.min(state.selectionStart.y, currentY);
            const width = Math.abs(currentX - state.selectionStart.x);
            const height = Math.abs(currentY - state.selectionStart.y);

            // Position relative to container
            const canvasOffsetX = rect.left - canvasRect.left;
            const canvasOffsetY = rect.top - canvasRect.top;

            elements.selectionBox.style.left = (canvasOffsetX + left * state.zoom) + 'px';
            elements.selectionBox.style.top = (canvasOffsetY + top * state.zoom) + 'px';
            elements.selectionBox.style.width = (width * state.zoom) + 'px';
            elements.selectionBox.style.height = (height * state.zoom) + 'px';

            state.selectionRect = { left, top, width, height };
        }

        function endSelection(e) {
            if (!state.selectionStart) return;
            updateSelection(e);
            state.selectionStart = null;
        }

        function clearSelection() {
            state.selectionRect = null;
            state.selectionStart = null;
            elements.selectionBox.style.display = 'none';
        }

        function getSelectedRegionCanvas() {
            if (!state.selectionRect || state.currentIndex < 0) return null;

            const { left, top, width, height } = state.selectionRect;
            if (width < 10 || height < 10) return null;

            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = width;
            canvas.height = height;

            ctx.drawImage(
                elements.imageCanvas,
                left, top, width, height,
                0, 0, width, height
            );

            return canvas;
        }

        // ==================== OCR ====================
        async function startOCR() {
            if (state.currentIndex < 0) {
                showToast('請先上傳圖片', 'error');
                return;
            }

            elements.resultLoading.classList.add('visible');
            $('#loadingText').textContent = '識別中...';

            const startTime = performance.now();

            try {
                // Get image data
                let canvas = state.selectionRect
                    ? getSelectedRegionCanvas()
                    : elements.imageCanvas;

                if (!canvas) {
                    canvas = elements.imageCanvas;
                }

                const imageData = canvas.toDataURL('image/jpeg', state.settings.imageQuality);
                const base64Data = imageData.split(',')[1];

                // Build prompt based on mode
                const prompt = buildPrompt();

                // Call API
                const result = await callOCRAPI(base64Data, prompt);

                const endTime = performance.now();
                const duration = ((endTime - startTime) / 1000).toFixed(2);
                $('#processTime').textContent = `處理時間: ${duration}s`;

                // Display result
                displayResult(result);

                // Save to history
                saveToHistory(result, imageData);

            } catch (error) {
                console.error('OCR Error:', error);
                showToast('識別失敗: ' + error.message, 'error');
            } finally {
                elements.resultLoading.classList.remove('visible');
            }
        }

        function buildPrompt() {
            const prompts = {
                text: '請識別並提取圖片中的所有文字內容，保持原始排版格式。只輸出識別到的文字，不要添加任何解釋。',
                structured: '請識別圖片中的所有文字，並保留其結構格式（包括段落、縮排、列表等）。以 Markdown 格式輸出。',
                table: '請識別圖片中的表格內容，並轉換為 Markdown 表格格式輸出。如果有多個表格，請分別輸出。',
                handwriting: '請識別圖片中的手寫文字內容。盡可能準確地辨識每個字，如有不確定的字請用 [?] 標記。',
                multilang: '請識別圖片中的所有文字，可能包含多種語言（如中文、英文、日文、韓文等）。請準確識別並保持原始語言。',
                custom: $('#customPrompt').value || '請識別圖片中的文字內容。'
            };

            return prompts[state.currentMode] || prompts.text;
        }

        async function callOCRAPI(base64Image, prompt) {
            const model = state.settings.customModel || state.settings.model || elements.headerModelSelect.value || 'qwen3-vl-8b-instruct';

            const requestBody = {
                model: model,
                messages: [
                    {
                        role: 'user',
                        content: [
                            {
                                type: 'image_url',
                                image_url: {
                                    url: `data:image/jpeg;base64,${base64Image}`
                                }
                            },
                            {
                                type: 'text',
                                text: prompt
                            }
                        ]
                    }
                ],
                temperature: state.settings.temperature,
                max_tokens: state.settings.maxTokens,
                stream: false
            };

            const response = await fetch(state.settings.apiEndpoint, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(requestBody)
            });

            if (!response.ok) {
                throw new Error(`API 錯誤: ${response.status} ${response.statusText}`);
            }

            const data = await response.json();

            // Update token usage
            if (data.usage) {
                $('#tokenUsage').textContent = `Token: ${data.usage.total_tokens || 'N/A'}`;
            }

            return data.choices[0].message.content;
        }

        function displayResult(text) {
            state.lastResult = text;
            elements.resultContent.textContent = text;

            // Update compare view
            $('#compareOriginal').textContent = text;
            $('#compareEdited').textContent = text;
        }

        // ==================== Result Actions ====================
        function copyResult() {
            const text = state.lastResult;
            if (!text) {
                showToast('沒有可複製的內容', 'error');
                return;
            }

            navigator.clipboard.writeText(text).then(() => {
                showToast('已複製到剪貼簿', 'success');
            }).catch(() => {
                showToast('複製失敗', 'error');
            });
        }

        function exportResult(format) {
            const text = state.lastResult;
            if (!text) {
                showToast('沒有可匯出的內容', 'error');
                return;
            }

            let content, filename, mimeType;
            const timestamp = new Date().toISOString().slice(0, 19).replace(/[:-]/g, '');

            switch (format) {
                case 'txt':
                    content = text;
                    filename = `ocr-result-${timestamp}.txt`;
                    mimeType = 'text/plain';
                    break;
                case 'md':
                    content = `# OCR 識別結果\n\n${text}\n\n---\n*由 Qwen3-VL OCR 產生於 ${new Date().toLocaleString('zh-TW')}*`;
                    filename = `ocr-result-${timestamp}.md`;
                    mimeType = 'text/markdown';
                    break;
                case 'json':
                    content = JSON.stringify({
                        result: text,
                        mode: state.currentMode,
                        timestamp: new Date().toISOString(),
                        settings: state.settings
                    }, null, 2);
                    filename = `ocr-result-${timestamp}.json`;
                    mimeType = 'application/json';
                    break;
                case 'csv':
                    // Simple CSV conversion - split by lines and tabs
                    const lines = text.split('\n').map(line =>
                        '"' + line.replace(/"/g, '""') + '"'
                    );
                    content = lines.join('\n');
                    filename = `ocr-result-${timestamp}.csv`;
                    mimeType = 'text/csv';
                    break;
            }

            const blob = new Blob([content], { type: mimeType });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            a.click();
            URL.revokeObjectURL(url);

            showToast(`已匯出 ${format.toUpperCase()} 檔案`, 'success');
        }

        function clearResult() {
            state.lastResult = '';
            elements.resultContent.innerHTML = '<span style="color: var(--text-secondary);">識別結果將顯示於此...</span>';
            $('#compareOriginal').textContent = '';
            $('#compareEdited').textContent = '';
        }

        // ==================== Tabs ====================
        function switchTab(tabName) {
            $$('.result-tab').forEach(tab => {
                tab.classList.toggle('active', tab.dataset.tab === tabName);
            });

            $$('[data-tab-content]').forEach(content => {
                const isTarget = content.dataset.tabContent === tabName;
                if (tabName === 'compare') {
                    content.classList.toggle('visible', isTarget);
                    content.classList.toggle('hidden', !isTarget && content.id !== 'compareContainer');
                } else {
                    content.classList.toggle('hidden', !isTarget);
                    content.classList.toggle('visible', isTarget);
                }
            });

            if (tabName === 'history') {
                renderHistoryInTab();
            }
        }

        // ==================== Mode Selection ====================
        function setMode(mode) {
            state.currentMode = mode;
            $$('.mode-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.mode === mode);
            });

            $('#customPromptContainer').classList.toggle('visible', mode === 'custom');
        }

        // ==================== History ====================
        function loadHistory() {
            const saved = localStorage.getItem('qwen-ocr-history');
            if (saved) {
                state.history = JSON.parse(saved);
            }
        }

        function saveToHistory(result, thumbnail) {
            const entry = {
                id: Date.now(),
                result: result,
                thumbnail: thumbnail.substring(0, 200), // Save small portion
                mode: state.currentMode,
                timestamp: new Date().toISOString()
            };

            state.history.unshift(entry);
            state.history = state.history.slice(0, 50); // Keep last 50

            localStorage.setItem('qwen-ocr-history', JSON.stringify(state.history));
        }

        function renderHistoryList() {
            const container = $('#historyList');

            if (state.history.length === 0) {
                container.innerHTML = '<p style="color:var(--text-secondary);text-align:center;">暫無歷史記錄</p>';
                return;
            }

            container.innerHTML = state.history.map(entry => `
                <div class="history-item" data-id="${entry.id}">
                    <div class="history-time">${new Date(entry.timestamp).toLocaleString('zh-TW')}</div>
                    <div class="history-preview">${entry.result.substring(0, 100)}...</div>
                </div>
            `).join('');

            container.querySelectorAll('.history-item').forEach(item => {
                item.addEventListener('click', () => {
                    const entry = state.history.find(h => h.id === parseInt(item.dataset.id));
                    if (entry) {
                        displayResult(entry.result);
                        elements.historyModal.classList.remove('visible');
                    }
                });
            });
        }

        function renderHistoryInTab() {
            const container = $('#historyContent');

            if (state.history.length === 0) {
                container.innerHTML = '<p style="color:var(--text-secondary);text-align:center;padding:20px;">暫無歷史記錄</p>';
                return;
            }

            container.innerHTML = state.history.map(entry => `
                <div class="history-item" data-id="${entry.id}">
                    <div class="history-time">${new Date(entry.timestamp).toLocaleString('zh-TW')} - ${entry.mode}</div>
                    <div class="history-preview">${entry.result.substring(0, 150)}...</div>
                </div>
            `).join('');

            container.querySelectorAll('.history-item').forEach(item => {
                item.addEventListener('click', () => {
                    const entry = state.history.find(h => h.id === parseInt(item.dataset.id));
                    if (entry) {
                        displayResult(entry.result);
                        switchTab('result');
                    }
                });
            });
        }

        function clearHistoryData() {
            if (confirm('確定要清除所有歷史記錄嗎？')) {
                state.history = [];
                localStorage.removeItem('qwen-ocr-history');
                renderHistoryList();
                showToast('歷史記錄已清除', 'success');
            }
        }

        // ==================== Camera ====================
        let cameraStream = null;

        async function openCamera() {
            try {
                cameraStream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: 'environment' }
                });
                $('#cameraVideo').srcObject = cameraStream;
                elements.cameraModal.classList.add('visible');
            } catch (error) {
                showToast('無法存取攝影機: ' + error.message, 'error');
            }
        }

        function closeCamera() {
            if (cameraStream) {
                cameraStream.getTracks().forEach(track => track.stop());
                cameraStream = null;
            }
            elements.cameraModal.classList.remove('visible');
        }

        function capturePhoto() {
            const video = $('#cameraVideo');
            const canvas = document.createElement('canvas');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            canvas.getContext('2d').drawImage(video, 0, 0);

            canvas.toBlob((blob) => {
                const file = new File([blob], 'camera-capture.jpg', { type: 'image/jpeg' });
                processFiles([file]);
            }, 'image/jpeg', 0.9);

            closeCamera();
        }

        // ==================== URL Loading ====================
        async function loadFromUrl() {
            const url = $('#imageUrl').value.trim();
            if (!url) {
                showToast('請輸入網址', 'error');
                return;
            }

            elements.urlModal.classList.remove('visible');
            elements.imageLoading.classList.add('visible');

            try {
                const response = await fetch(url);
                const blob = await response.blob();
                const file = new File([blob], 'url-image', { type: blob.type });
                await processFiles([file]);
            } catch (error) {
                showToast('載入失敗: ' + error.message, 'error');
            } finally {
                elements.imageLoading.classList.remove('visible');
            }
        }

        // ==================== Connection Check ====================
        async function checkConnection() {
            try {
                const baseUrl = state.settings.apiEndpoint.replace('/chat/completions', '');
                const response = await fetch(baseUrl + '/models', {
                    method: 'GET',
                    signal: AbortSignal.timeout(5000)
                });

                state.isOnline = response.ok;
                updateConnectionStatus();
            } catch (error) {
                state.isOnline = false;
                updateConnectionStatus();
            }
        }

        function updateConnectionStatus() {
            const dot = $('#connectionStatus');
            const text = $('#connectionText');

            if (state.isOnline) {
                dot.classList.add('online');
                dot.classList.remove('offline');
                text.textContent = 'API 已連線';
            } else {
                dot.classList.add('offline');
                dot.classList.remove('online');
                text.textContent = 'API 離線';
            }
        }

        async function refreshModelList() {
            const select = $('#modelSelect');
            select.innerHTML = '<option value="">載入中...</option>';

            try {
                const baseUrl = state.settings.apiEndpoint.replace('/chat/completions', '');
                const response = await fetch(baseUrl + '/models');
                const data = await response.json();

                select.innerHTML = '<option value="qwen3-vl-8b-instruct">Qwen3-VL-8B (預設)</option>';

                if (data.data) {
                    state.availableModels = data.data;
                    data.data.forEach(model => {
                        if (model.id !== 'qwen3-vl-8b-instruct') {
                            const option = document.createElement('option');
                            option.value = model.id;
                            option.textContent = model.id;
                            if (model.id === state.settings.model) {
                                option.selected = true;
                            }
                            select.appendChild(option);
                        }
                    });

                    // Select current model
                    if (state.settings.model) {
                        select.value = state.settings.model;
                    }
                }

                showToast('模型列表已更新', 'success');
            } catch (error) {
                select.innerHTML = '<option value="qwen3-vl-8b-instruct">Qwen3-VL-8B (預設)</option>';
                showToast('無法取得模型列表', 'error');
            }
        }

        async function refreshHeaderModelList() {
            const select = elements.headerModelSelect;
            const refreshBtn = $('#headerRefreshModels');

            refreshBtn.classList.add('loading');
            select.innerHTML = '<option value="">載入中...</option>';

            try {
                const baseUrl = state.settings.apiEndpoint.replace('/chat/completions', '');
                const response = await fetch(baseUrl + '/models', {
                    signal: AbortSignal.timeout(5000)
                });
                const data = await response.json();

                // Build options with Qwen3-VL as default
                select.innerHTML = '<option value="qwen3-vl-8b-instruct">Qwen3-VL-8B (預設)</option>';

                if (data.data) {
                    state.availableModels = data.data;

                    // Check if Qwen3-VL exists in the list
                    const hasQwen = data.data.some(m =>
                        m.id.toLowerCase().includes('qwen') && m.id.toLowerCase().includes('vl')
                    );

                    data.data.forEach(model => {
                        // Skip if already added as default
                        if (model.id === 'qwen3-vl-8b-instruct') return;

                        const option = document.createElement('option');
                        option.value = model.id;

                        // Mark Qwen VL models
                        if (model.id.toLowerCase().includes('qwen') && model.id.toLowerCase().includes('vl')) {
                            option.textContent = model.id + ' (VL)';
                        } else {
                            option.textContent = model.id;
                        }

                        select.appendChild(option);
                    });
                }

                // Select saved model or default
                select.value = state.settings.model || 'qwen3-vl-8b-instruct';

                // If saved model doesn't exist in list, reset to default
                if (!select.value) {
                    select.value = 'qwen3-vl-8b-instruct';
                    state.settings.model = 'qwen3-vl-8b-instruct';
                }

            } catch (error) {
                // Keep default option on error
                select.innerHTML = '<option value="qwen3-vl-8b-instruct">Qwen3-VL-8B (預設)</option>';
                select.value = 'qwen3-vl-8b-instruct';
            } finally {
                refreshBtn.classList.remove('loading');
            }
        }

        // ==================== Theme ====================
        function toggleTheme() {
            document.body.classList.toggle('light-theme');
            const isLight = document.body.classList.contains('light-theme');
            localStorage.setItem('qwen-ocr-theme', isLight ? 'light' : 'dark');
        }

        function loadTheme() {
            const saved = localStorage.getItem('qwen-ocr-theme');
            if (saved === 'light') {
                document.body.classList.add('light-theme');
            }
        }
        loadTheme();

        // ==================== Utilities ====================
        function showToast(message, type = 'info') {
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.textContent = message;
            elements.toastContainer.appendChild(toast);

            setTimeout(() => {
                toast.style.animation = 'slideIn 0.3s ease reverse';
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        function clearAll() {
            if (state.images.length === 0) return;

            if (confirm('確定要清除所有圖片嗎？')) {
                state.images = [];
                state.currentIndex = -1;
                state.zoom = 1;
                state.rotation = 0;
                clearSelection();

                elements.dropZone.classList.remove('hidden');
                elements.imageCanvas.getContext('2d').clearRect(0, 0, elements.imageCanvas.width, elements.imageCanvas.height);
                elements.zoomIndicator.style.display = 'none';
                elements.thumbnailsBar.innerHTML = '';
                $('#imageInfo').textContent = '圖片: --';
            }
        }

        function resetSettings() {
            state.settings = {
                apiEndpoint: 'http://localhost:1234/v1/chat/completions',
                model: 'qwen3-vl-8b-instruct',
                customModel: '',
                temperature: 0.1,
                maxTokens: 4096,
                maxResolution: 2048,
                imageQuality: 0.85
            };
            applySettings();
            elements.headerModelSelect.value = 'qwen3-vl-8b-instruct';
            showToast('已重設為預設值', 'success');
        }

        // ==================== Keyboard Shortcuts ====================
        function handleKeyboard(e) {
            // Ctrl+V is handled by paste event

            if (e.ctrlKey || e.metaKey) {
                switch (e.key) {
                    case 'Enter':
                        e.preventDefault();
                        startOCR();
                        break;
                    case 'c':
                        if (!window.getSelection().toString()) {
                            e.preventDefault();
                            copyResult();
                        }
                        break;
                }
            }

            // ESC to close modals
            if (e.key === 'Escape') {
                elements.settingsModal.classList.remove('visible');
                elements.historyModal.classList.remove('visible');
                elements.cameraModal.classList.remove('visible');
                elements.urlModal.classList.remove('visible');
                elements.pdfPageModal.classList.remove('visible');
                closeCamera();
            }
        }

        // ==================== PWA Setup ====================
        function setupPWA() {
            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.register('sw.js').catch(() => {
                    // Service worker registration failed, app still works
                });
            }
        }
    </script>
</body>
</html>
