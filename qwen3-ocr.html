<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="Qwen3-VL OCR 專業光學字符識別工具">
    <meta name="theme-color" content="#1a1a2e">
    <title>Qwen3-VL OCR 專業識別工具</title>
    <link rel="manifest" href="manifest.json">
    <style>
        :root {
            --bg-primary: #1a1a2e;
            --bg-secondary: #16213e;
            --bg-tertiary: #0f3460;
            --text-primary: #eaeaea;
            --text-secondary: #a0a0a0;
            --accent: #e94560;
            --accent-hover: #ff6b6b;
            --success: #4ecca3;
            --warning: #ffc107;
            --border: #2a2a4a;
            --shadow: rgba(0,0,0,0.3);
        }
        .light-theme {
            --bg-primary: #f5f5f5;
            --bg-secondary: #ffffff;
            --bg-tertiary: #e8e8e8;
            --text-primary: #333333;
            --text-secondary: #666666;
            --accent: #e94560;
            --accent-hover: #d63850;
            --border: #ddd;
            --shadow: rgba(0,0,0,0.1);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            height: 100%;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft JhengHei', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
        }
        .app-container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            max-height: 100vh;
        }
        /* Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 16px;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
        }
        .header h1 {
            font-size: 16px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .header-actions {
            display: flex;
            gap: 8px;
            align-items: center;
        }
        .btn {
            padding: 6px 12px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .btn-primary {
            background: var(--accent);
            color: white;
        }
        .btn-primary:hover { background: var(--accent-hover); }
        .btn-secondary {
            background: var(--bg-tertiary);
            color: var(--text-primary);
            border: 1px solid var(--border);
        }
        .btn-secondary:hover { background: var(--border); }
        .btn-icon {
            padding: 6px;
            background: transparent;
            color: var(--text-secondary);
        }
        .btn-icon:hover { color: var(--text-primary); }
        /* Main Content */
        .main-content {
            display: flex;
            flex: 1;
            overflow: hidden;
            min-height: 0;
        }
        /* Left Panel - Image */
        .left-panel {
            width: 50%;
            display: flex;
            flex-direction: column;
            border-right: 1px solid var(--border);
            min-width: 300px;
        }
        .image-toolbar {
            display: flex;
            gap: 4px;
            padding: 6px 8px;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border);
            flex-wrap: wrap;
        }
        .toolbar-group {
            display: flex;
            gap: 2px;
            padding-right: 8px;
            border-right: 1px solid var(--border);
        }
        .toolbar-group:last-child { border-right: none; }
        .image-container {
            flex: 1;
            position: relative;
            overflow: hidden;
            background: var(--bg-primary);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .drop-zone {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border: 2px dashed var(--border);
            margin: 8px;
            border-radius: 8px;
            transition: all 0.3s;
            cursor: pointer;
        }
        .drop-zone.active {
            border-color: var(--accent);
            background: rgba(233, 69, 96, 0.1);
        }
        .drop-zone.hidden { display: none; }
        .drop-zone-icon { font-size: 48px; margin-bottom: 12px; opacity: 0.5; }
        .drop-zone-text { color: var(--text-secondary); font-size: 14px; }
        .drop-zone-hint { color: var(--text-secondary); font-size: 11px; margin-top: 8px; }
        #imageCanvas {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            cursor: crosshair;
        }
        .selection-box {
            position: absolute;
            border: 2px solid var(--accent);
            background: rgba(233, 69, 96, 0.2);
            pointer-events: none;
            display: none;
        }
        /* Thumbnails */
        .thumbnails-bar {
            display: flex;
            gap: 4px;
            padding: 6px 8px;
            background: var(--bg-secondary);
            border-top: 1px solid var(--border);
            overflow-x: auto;
            flex-shrink: 0;
            min-height: 60px;
        }
        .thumbnail {
            width: 48px;
            height: 48px;
            border-radius: 4px;
            object-fit: cover;
            cursor: pointer;
            border: 2px solid transparent;
            flex-shrink: 0;
            transition: all 0.2s;
        }
        .thumbnail.active { border-color: var(--accent); }
        .thumbnail:hover { opacity: 0.8; }
        .thumbnail-wrapper {
            position: relative;
        }
        .thumbnail-close {
            position: absolute;
            top: -4px;
            right: -4px;
            width: 16px;
            height: 16px;
            background: var(--accent);
            border-radius: 50%;
            border: none;
            color: white;
            font-size: 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .page-indicator {
            position: absolute;
            bottom: 2px;
            right: 2px;
            background: rgba(0,0,0,0.7);
            color: white;
            font-size: 9px;
            padding: 1px 4px;
            border-radius: 2px;
        }
        /* Right Panel - Results */
        .right-panel {
            width: 50%;
            display: flex;
            flex-direction: column;
            min-width: 300px;
        }
        .mode-selector {
            display: flex;
            gap: 4px;
            padding: 6px 8px;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border);
            flex-wrap: wrap;
        }
        .mode-btn {
            padding: 4px 10px;
            border: 1px solid var(--border);
            background: var(--bg-tertiary);
            color: var(--text-secondary);
            border-radius: 4px;
            cursor: pointer;
            font-size: 11px;
            transition: all 0.2s;
        }
        .mode-btn.active {
            background: var(--accent);
            border-color: var(--accent);
            color: white;
        }
        .mode-btn:hover:not(.active) { background: var(--border); }
        .custom-prompt-container {
            padding: 6px 8px;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border);
            display: none;
        }
        .custom-prompt-container.visible { display: block; }
        .custom-prompt-input {
            width: 100%;
            padding: 6px 8px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            border-radius: 4px;
            color: var(--text-primary);
            font-size: 12px;
            resize: none;
        }
        .result-tabs {
            display: flex;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border);
        }
        .result-tab {
            padding: 6px 16px;
            border: none;
            background: transparent;
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 12px;
            border-bottom: 2px solid transparent;
            transition: all 0.2s;
        }
        .result-tab.active {
            color: var(--accent);
            border-bottom-color: var(--accent);
        }
        .result-container {
            flex: 1;
            overflow: hidden;
            position: relative;
            display: flex;
            flex-direction: column;
        }
        .result-content {
            flex: 1;
            overflow-y: auto;
            padding: 12px;
            font-size: 13px;
            line-height: 1.6;
            white-space: pre-wrap;
            word-break: break-word;
        }
        .result-content.hidden { display: none; }
        .compare-container {
            display: none;
            flex: 1;
            overflow: hidden;
        }
        .compare-container.visible {
            display: flex;
        }
        .compare-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            border-right: 1px solid var(--border);
        }
        .compare-panel:last-child { border-right: none; }
        .compare-header {
            padding: 6px 8px;
            background: var(--bg-tertiary);
            font-size: 11px;
            font-weight: 600;
        }
        .compare-content {
            flex: 1;
            overflow-y: auto;
            padding: 8px;
            font-size: 12px;
        }
        .compare-content[contenteditable="true"] {
            outline: none;
            background: var(--bg-primary);
        }
        .result-actions {
            display: flex;
            gap: 4px;
            padding: 6px 8px;
            background: var(--bg-secondary);
            border-top: 1px solid var(--border);
            flex-wrap: wrap;
        }
        /* Status Bar */
        .status-bar {
            display: flex;
            justify-content: space-between;
            padding: 4px 12px;
            background: var(--bg-secondary);
            border-top: 1px solid var(--border);
            font-size: 11px;
            color: var(--text-secondary);
            flex-shrink: 0;
        }
        .status-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--text-secondary);
        }
        .status-dot.online { background: var(--success); }
        .status-dot.offline { background: var(--accent); }
        /* Settings Modal */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.6);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .modal-overlay.visible { display: flex; }
        .modal {
            background: var(--bg-secondary);
            border-radius: 8px;
            width: 90%;
            max-width: 500px;
            max-height: 80vh;
            overflow-y: auto;
            box-shadow: 0 4px 20px var(--shadow);
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            border-bottom: 1px solid var(--border);
        }
        .modal-header h2 { font-size: 14px; }
        .modal-body { padding: 16px; }
        .form-group {
            margin-bottom: 12px;
        }
        .form-group label {
            display: block;
            font-size: 12px;
            margin-bottom: 4px;
            color: var(--text-secondary);
        }
        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 8px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            border-radius: 4px;
            color: var(--text-primary);
            font-size: 12px;
        }
        .form-group input[type="range"] {
            padding: 0;
        }
        .range-value {
            display: inline-block;
            margin-left: 8px;
            color: var(--accent);
        }
        .modal-footer {
            padding: 12px 16px;
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: flex-end;
            gap: 8px;
        }
        /* History Panel */
        .history-item {
            padding: 8px;
            border-bottom: 1px solid var(--border);
            cursor: pointer;
            transition: background 0.2s;
        }
        .history-item:hover { background: var(--bg-tertiary); }
        .history-time { font-size: 10px; color: var(--text-secondary); }
        .history-preview {
            font-size: 12px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-top: 4px;
        }
        /* Loading */
        .loading-overlay {
            position: absolute;
            inset: 0;
            background: rgba(0,0,0,0.5);
            display: none;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 12px;
            z-index: 100;
        }
        .loading-overlay.visible { display: flex; }
        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        /* Responsive */
        @media (max-width: 768px) {
            .main-content { flex-direction: column; }
            .left-panel, .right-panel {
                width: 100%;
                height: 50%;
                border-right: none;
            }
            .left-panel { border-bottom: 1px solid var(--border); }
        }
        /* Scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: var(--bg-primary); }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--text-secondary); }
        /* Toast */
        .toast-container {
            position: fixed;
            top: 60px;
            right: 16px;
            z-index: 2000;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .toast {
            padding: 10px 16px;
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 4px;
            box-shadow: 0 2px 10px var(--shadow);
            font-size: 12px;
            animation: slideIn 0.3s ease;
        }
        .toast.success { border-left: 3px solid var(--success); }
        .toast.error { border-left: 3px solid var(--accent); }
        .toast.info { border-left: 3px solid var(--warning); }
        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        /* File Input */
        .file-input { display: none; }
        /* Zoom indicator */
        .zoom-indicator {
            position: absolute;
            bottom: 8px;
            left: 8px;
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 11px;
        }
        /* Model Selector in Header */
        .model-selector-container {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 4px 8px;
            background: var(--bg-tertiary);
            border-radius: 4px;
            border: 1px solid var(--border);
        }
        .model-selector-container label {
            font-size: 11px;
            color: var(--text-secondary);
            white-space: nowrap;
        }
        .model-selector-container select {
            padding: 4px 8px;
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 4px;
            color: var(--text-primary);
            font-size: 11px;
            min-width: 160px;
            cursor: pointer;
        }
        .model-selector-container .refresh-btn {
            padding: 4px;
            background: transparent;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            display: flex;
            align-items: center;
        }
        .model-selector-container .refresh-btn:hover {
            color: var(--accent);
        }
        .model-selector-container .refresh-btn.loading svg {
            animation: spin 1s linear infinite;
        }
        /* PDF Page Range Styles */
        .page-range-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(40px, 1fr));
            gap: 6px;
            max-height: 200px;
            overflow-y: auto;
            padding: 8px;
            background: var(--bg-primary);
            border-radius: 4px;
            margin: 8px 0;
        }
        .page-checkbox {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 8px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.2s;
        }
        .page-checkbox:hover {
            border-color: var(--accent);
        }
        .page-checkbox.selected {
            background: var(--accent);
            border-color: var(--accent);
            color: white;
        }
        .range-input-group {
            display: flex;
            gap: 8px;
            align-items: center;
            margin-bottom: 12px;
        }
        .range-input-group input {
            width: 80px;
            padding: 6px 8px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            border-radius: 4px;
            color: var(--text-primary);
            font-size: 12px;
            text-align: center;
        }
        .range-input-group span {
            color: var(--text-secondary);
            font-size: 12px;
        }
        .quick-select-btns {
            display: flex;
            gap: 6px;
            margin-bottom: 12px;
            flex-wrap: wrap;
        }
        .quick-select-btns button {
            padding: 4px 10px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            border-radius: 4px;
            color: var(--text-primary);
            font-size: 11px;
            cursor: pointer;
        }
        .quick-select-btns button:hover {
            background: var(--border);
        }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <header class="header">
            <h1>
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="10"/>
                    <path d="M12 16v-4M12 8h.01"/>
                </svg>
                Qwen3-VL OCR
            </h1>
            <div class="header-actions">
                <div class="model-selector-container">
                    <label>模型:</label>
                    <select id="headerModelSelect">
                        <option value="qwen3-vl-8b-instruct">Qwen3-VL-8B (預設)</option>
                    </select>
                    <button class="refresh-btn" id="headerRefreshModels" title="重新整理模型列表">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M21.5 2v6h-6M2.5 22v-6h6M2 11.5a10 10 0 0 1 18.8-4.3M22 12.5a10 10 0 0 1-18.8 4.3"/>
                        </svg>
                    </button>
                </div>
                <button class="btn btn-icon" id="themeToggle" title="切換主題">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="5"/>
                        <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
                    </svg>
                </button>
                <button class="btn btn-icon" id="historyBtn" title="歷史記錄">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="10"/>
                        <polyline points="12 6 12 12 16 14"/>
                    </svg>
                </button>
                <button class="btn btn-secondary" id="settingsBtn">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="3"/>
                        <path d="M12 1v6M12 17v6M4.22 4.22l4.24 4.24M15.54 15.54l4.24 4.24M1 12h6M17 12h6M4.22 19.78l4.24-4.24M15.54 8.46l4.24-4.24"/>
                    </svg>
                    設定
                </button>
                <button class="btn btn-primary" id="startOCR">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polygon points="5 3 19 12 5 21 5 3"/>
                    </svg>
                    開始識別
                </button>
            </div>
        </header>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Left Panel - Image -->
            <section class="left-panel">
                <div class="image-toolbar">
                    <div class="toolbar-group">
                        <button class="btn btn-icon" id="openFile" title="開啟檔案">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>
                            </svg>
                        </button>
                        <button class="btn btn-icon" id="pasteImage" title="貼上圖片 (Ctrl+V)">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/>
                                <rect x="8" y="2" width="8" height="4" rx="1" ry="1"/>
                            </svg>
                        </button>
                        <button class="btn btn-icon" id="cameraCapture" title="攝影機拍照">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
                                <circle cx="12" cy="13" r="4"/>
                            </svg>
                        </button>
                        <button class="btn btn-icon" id="loadUrl" title="從網址載入">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <circle cx="12" cy="12" r="10"/>
                                <line x1="2" y1="12" x2="22" y2="12"/>
                                <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
                            </svg>
                        </button>
                    </div>
                    <div class="toolbar-group">
                        <button class="btn btn-icon" id="rotateLeft" title="向左旋轉">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M2.5 2v6h6M2.66 15.57a10 10 0 1 0 .57-8.38"/>
                            </svg>
                        </button>
                        <button class="btn btn-icon" id="rotateRight" title="向右旋轉">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38"/>
                            </svg>
                        </button>
                        <button class="btn btn-icon" id="zoomIn" title="放大">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">

        </main>

        <!-- Status Bar -->
        <footer class="status-bar">

    <!-- Settings Modal -->
    <div class="modal-overlay" id="settingsModal">
        <div class="modal">

                    <input type="range" id="maxTokens" min="256" max="16384" step="256" value="4096">

                    <select id="maxResolution">
                        <option value="1024">1024 (快速)</option>

    <!-- PDF Page Range Modal -->
    <div class="modal-overlay" id="pdfPageModal">

            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label>檔案名稱: <span id="pdfFileName">-</span></label>
                    <label>總頁數: <span id="pdfTotalPages">-</span> 頁</label>

                <div class="form-group">
                    <label>頁面範圍</label>

                        <input type="number" id="pdfStartPage" min="1" value="1" placeholder="起始">
                        <span>至</span>
                        <input type="number" id="pdfEndPage" min="1" value="1" placeholder="結束">

                </div>

                    <label>快速選取</label>
                    <div class="quick-select-btns">

                        <button id="selectNonePages">取消全選</button>

                        <button id="selectFirst10">前 10 頁</button>
                    </div>
                </div>

                    <label>點選頁面（已選: <span id="selectedPageCount">0</span> 頁）</label>
                    <div class="page-range-grid" id="pageRangeGrid"></div>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" id="cancelPdfPage">取消</button>
                <button class="btn btn-primary" id="confirmPdfPages">載入選取頁面</button>

        </div>
