<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="Qwen3-VL OCR 專業光學字符識別工具">
    <meta name="theme-color" content="#1a1a2e">
    <title>Qwen3-VL OCR 專業識別工具</title>
    <link rel="manifest" href="manifest.json">
    <style>
        :root {
            --bg-primary: #1a1a2e;
            --bg-secondary: #16213e;
            --bg-tertiary: #0f3460;
            --text-primary: #eaeaea;
            --text-secondary: #a0a0a0;
            --accent: #e94560;
            --accent-hover: #ff6b6b;
            --success: #4ecca3;
            --warning: #ffc107;
            --border: #2a2a4a;
            --shadow: rgba(0,0,0,0.3);
        }
        .light-theme {
            --bg-primary: #f5f5f5;
            --bg-secondary: #ffffff;
            --bg-tertiary: #e8e8e8;
            --text-primary: #333333;
            --text-secondary: #666666;
            --accent: #e94560;
            --accent-hover: #d63850;
            --border: #ddd;
            --shadow: rgba(0,0,0,0.1);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            height: 100%;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft JhengHei', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
        }
        .app-container { display: flex; flex-direction: column; height: 100vh; }
        /* Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 12px;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
        }
        .header h1 { font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 6px; }
        .header-actions { display: flex; gap: 6px; align-items: center; }
        .btn {
            padding: 5px 10px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 11px;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .btn-primary { background: var(--accent); color: white; }
        .btn-primary:hover { background: var(--accent-hover); }
        .btn-secondary { background: var(--bg-tertiary); color: var(--text-primary); border: 1px solid var(--border); }
        .btn-secondary:hover { background: var(--border); }
        .btn-icon { padding: 5px; background: transparent; color: var(--text-secondary); border: none; cursor: pointer; }
        .btn-icon:hover { color: var(--text-primary); }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        /* Model Selector */
        .model-selector-container {
            display: flex; align-items: center; gap: 4px;
            padding: 3px 6px; background: var(--bg-tertiary);
            border-radius: 4px; border: 1px solid var(--border);
        }
        .model-selector-container label { font-size: 10px; color: var(--text-secondary); }
        .model-selector-container select {
            padding: 3px 6px; background: var(--bg-secondary);
            border: 1px solid var(--border); border-radius: 3px;
            color: var(--text-primary); font-size: 10px; min-width: 140px;
        }
        /* Main Content */
        .main-content { display: flex; flex: 1; overflow: hidden; min-height: 0; }
        /* Left Panel - Now with file input + queue */
        .left-panel {
            width: 220px;
            display: flex;
            flex-direction: column;
            border-right: 1px solid var(--border);
            min-width: 180px;
            max-width: 280px;
            flex-shrink: 0;
        }
        .file-section {
            padding: 8px;
            border-bottom: 1px solid var(--border);
            background: var(--bg-secondary);
        }
        .file-section-title {
            font-size: 11px;
            font-weight: 600;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .drop-zone-mini {
            border: 2px dashed var(--border);
            border-radius: 6px;
            padding: 12px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
        }
        .drop-zone-mini:hover, .drop-zone-mini.active {
            border-color: var(--accent);
            background: rgba(233, 69, 96, 0.1);
        }
        .drop-zone-mini-icon { font-size: 24px; margin-bottom: 4px; }
        .drop-zone-mini-text { font-size: 10px; color: var(--text-secondary); }
        /* Queue Section */
        .queue-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .queue-header {
            padding: 6px 8px;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border);
            font-size: 11px;
            font-weight: 600;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .queue-container {
            flex: 1;
            overflow-y: auto;
            padding: 4px;
        }
        .queue-item {
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            border-radius: 4px;
            margin-bottom: 4px;
            font-size: 10px;
        }
        .queue-item.active { border-color: var(--accent); }
        .queue-item-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 4px 6px;
            cursor: pointer;
        }
        .queue-item-header:hover { background: var(--bg-secondary); }
        .queue-item-name {
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            font-weight: 500;
        }
        .queue-item-actions { display: flex; gap: 2px; }
        .queue-item-actions button {
            padding: 1px 4px;
            font-size: 9px;
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            color: var(--text-primary);
            border-radius: 2px;
            cursor: pointer;
        }
        .queue-item-actions button:hover { background: var(--border); }
        .queue-item-body { padding: 4px 6px; border-top: 1px solid var(--border); }
        .queue-page-input {
            width: 100%;
            padding: 3px 5px;
            background: var(--bg-primary);
            border: 1px solid var(--border);
            border-radius: 3px;
            color: var(--text-primary);
            font-size: 9px;
        }
        .queue-page-info { color: var(--text-secondary); font-size: 9px; margin-top: 2px; }
        .queue-page-error { color: var(--accent); font-size: 9px; margin-top: 2px; }
        .queue-summary {
            padding: 4px 8px;
            background: var(--bg-secondary);
            border-top: 1px solid var(--border);
            font-size: 9px;
            color: var(--text-secondary);
        }
        .queue-actions {
            padding: 6px;
            background: var(--bg-secondary);
            border-top: 1px solid var(--border);
            display: flex;
            gap: 4px;
            flex-wrap: wrap;
        }
        /* Center Panel - Image preview */
        .center-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 300px;
        }
        .image-toolbar {
            display: flex;
            gap: 3px;
            padding: 4px 6px;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border);
            flex-wrap: wrap;
            align-items: center;
        }
        .toolbar-group {
            display: flex;
            gap: 2px;
            padding-right: 6px;
            border-right: 1px solid var(--border);
        }
        .toolbar-group:last-child { border-right: none; }
        .image-container {
            flex: 1;
            position: relative;
            overflow: hidden;
            background: var(--bg-primary);
        }
        .image-wrapper {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            cursor: grab;
        }
        .image-wrapper.dragging { cursor: grabbing; }
        .image-wrapper canvas { display: block; max-width: none; }
        .no-image-hint {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: var(--text-secondary);
            font-size: 12px;
        }
        .no-image-hint.hidden { display: none; }
        .selection-box {
            position: absolute;
            border: 2px solid var(--accent);
            background: rgba(233, 69, 96, 0.2);
            pointer-events: none;
            display: none;
        }
        .zoom-indicator {
            position: absolute;
            bottom: 6px;
            left: 6px;
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 3px 6px;
            border-radius: 3px;
            font-size: 10px;
        }
        /* Page Selection Controls */
        .page-select-controls {
            display: flex;
            gap: 4px;
            padding: 4px 6px;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border);
            align-items: center;
            font-size: 10px;
        }
        .page-select-btn {
            padding: 3px 8px;
            border: 1px solid var(--border);
            background: var(--bg-tertiary);
            color: var(--text-secondary);
            border-radius: 3px;
            cursor: pointer;
            font-size: 9px;
        }
        .page-select-btn:hover { background: var(--border); }
        .page-select-btn.active { background: var(--accent); border-color: var(--accent); color: white; }
        /* Thumbnails */
        .thumbnails-bar {
            display: flex;
            gap: 3px;
            padding: 4px 6px;
            background: var(--bg-secondary);
            border-top: 1px solid var(--border);
            overflow-x: auto;
            flex-shrink: 0;
            min-height: 50px;
        }
        .thumbnail {
            width: 40px;
            height: 40px;
            border-radius: 3px;
            object-fit: cover;
            cursor: pointer;
            border: 2px solid transparent;
            flex-shrink: 0;
        }
        .thumbnail.active { border-color: var(--accent); }
        .thumbnail.selected { border-color: var(--success); }
        .thumbnail-wrapper { position: relative; }
        .thumbnail-checkbox {
            position: absolute;
            top: 2px;
            left: 2px;
            width: 14px;
            height: 14px;
            cursor: pointer;
        }
        .page-indicator {
            position: absolute;
            bottom: 1px;
            right: 1px;
            background: rgba(0,0,0,0.7);
            color: white;
            font-size: 8px;
            padding: 1px 3px;
            border-radius: 2px;
        }
        /* Right Panel */
        .right-panel {
            width: 45%;
            display: flex;
            flex-direction: column;
            min-width: 280px;
            border-left: 1px solid var(--border);
        }
        .right-tabs {
            display: flex;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border);
        }
        .right-tab {
            padding: 6px 12px;
            border: none;
            background: transparent;
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 11px;
            border-bottom: 2px solid transparent;
        }
        .right-tab.active { color: var(--accent); border-bottom-color: var(--accent); }
        .tab-content {
            flex: 1;
            display: none;
            flex-direction: column;
            overflow: hidden;
        }
        .tab-content.active { display: flex; }
        /* OCR Controls */
        .ocr-controls {
            padding: 6px;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border);
        }
        .ocr-mode-row {
            display: flex;
            gap: 4px;
            margin-bottom: 6px;
            flex-wrap: wrap;
        }
        .mode-btn {
            padding: 3px 8px;
            border: 1px solid var(--border);
            background: var(--bg-tertiary);
            color: var(--text-secondary);
            border-radius: 3px;
            cursor: pointer;
            font-size: 10px;
        }
        .mode-btn.active { background: var(--accent); border-color: var(--accent); color: white; }
        .ocr-scope-row {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
        }
        .ocr-scope-row label {
            font-size: 10px;
            display: flex;
            align-items: center;
            gap: 3px;
            cursor: pointer;
        }
        .output-format-row {
            display: flex;
            gap: 4px;
            align-items: center;
            margin-top: 6px;
            flex-wrap: wrap;
        }
        .output-format-row label { font-size: 10px; color: var(--text-secondary); }
        .output-format-row select {
            padding: 3px 6px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            border-radius: 3px;
            color: var(--text-primary);
            font-size: 10px;
        }
        /* Result Actions at Top */
        .result-actions-top {
            display: flex;
            gap: 3px;
            padding: 4px 6px;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border);
            flex-wrap: wrap;
        }
        /* Result */
        .result-container {
            flex: 1;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            position: relative;
        }
        .result-content {
            flex: 1;
            overflow-y: auto;
            padding: 8px;
            font-size: 12px;
            line-height: 1.5;
            white-space: pre-wrap;
            word-break: break-word;
        }
        .result-file-header {
            background: var(--bg-tertiary);
            padding: 6px 8px;
            margin: 8px 0 4px 0;
            border-radius: 4px;
            font-weight: bold;
            font-size: 11px;
        }
        .result-page-header {
            color: var(--accent);
            font-size: 10px;
            margin: 8px 0 4px 0;
            padding-bottom: 2px;
            border-bottom: 1px dashed var(--border);
        }
        /* Loading */
        .loading-overlay {
            position: absolute;
            inset: 0;
            background: rgba(0,0,0,0.5);
            display: none;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 8px;
            z-index: 100;
        }
        .loading-overlay.visible { display: flex; }
        .spinner {
            width: 30px;
            height: 30px;
            border: 3px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        /* Progress */
        .progress-bar {
            height: 3px;
            background: var(--bg-tertiary);
            border-radius: 2px;
            overflow: hidden;
            margin-top: 4px;
            width: 80%;
        }
        .progress-fill { height: 100%; background: var(--accent); transition: width 0.3s; }
        /* Status Bar */
        .status-bar {
            display: flex;
            justify-content: space-between;
            padding: 3px 10px;
            background: var(--bg-secondary);
            border-top: 1px solid var(--border);
            font-size: 10px;
            color: var(--text-secondary);
            flex-shrink: 0;
        }
        .status-item { display: flex; align-items: center; gap: 4px; }
        .status-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--text-secondary); }
        .status-dot.online { background: var(--success); }
        .status-dot.offline { background: var(--accent); }
        /* Modal */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.6);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .modal-overlay.visible { display: flex; }
        .modal {
            background: var(--bg-secondary);
            border-radius: 6px;
            width: 90%;
            max-width: 450px;
            max-height: 80vh;
            overflow-y: auto;
            box-shadow: 0 4px 20px var(--shadow);
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 12px;
            border-bottom: 1px solid var(--border);
        }
        .modal-header h2 { font-size: 13px; }
        .modal-body { padding: 12px; }
        .modal-footer {
            padding: 10px 12px;
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: flex-end;
            gap: 6px;
        }
        .form-group { margin-bottom: 10px; }
        .form-group label {
            display: block;
            font-size: 11px;
            margin-bottom: 3px;
            color: var(--text-secondary);
        }
        .form-group input, .form-group select, .form-group textarea {
            width: 100%;
            padding: 6px 8px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            border-radius: 4px;
            color: var(--text-primary);
            font-size: 11px;
        }
        .range-value { display: inline-block; margin-left: 6px; color: var(--accent); }
        /* Toast */
        .toast-container {
            position: fixed;
            top: 50px;
            right: 12px;
            z-index: 2000;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .toast {
            padding: 8px 12px;
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 4px;
            box-shadow: 0 2px 10px var(--shadow);
            font-size: 11px;
            animation: slideIn 0.3s ease;
        }
        .toast.success { border-left: 3px solid var(--success); }
        .toast.error { border-left: 3px solid var(--accent); }
        .toast.info { border-left: 3px solid var(--warning); }
        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        /* Responsive */
        @media (max-width: 900px) {
            .left-panel { width: 180px; min-width: 150px; }
            .right-panel { width: 40%; min-width: 220px; }
        }
        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-track { background: var(--bg-primary); }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
        .file-input { display: none; }
    </style>
</head>
<body>
    <div class="app-container">
        <header class="header">
            <h1>🔍 Qwen3-VL OCR</h1>
            <div class="header-actions">
                <div class="model-selector-container">
                    <label>模型:</label>
                    <select id="headerModelSelect"><option value="qwen3-vl-8b-instruct">Qwen3-VL-8B</option></select>
                    <button class="btn-icon" id="headerRefreshModels" title="重新整理">🔄</button>
                </div>
                <button class="btn btn-icon" id="themeToggle" title="切換主題">🌙</button>
                <button class="btn btn-secondary" id="settingsBtn">設定</button>
                <button class="btn btn-primary" id="startOCR">開始識別</button>
            </div>
        </header>

        <main class="main-content">
            <!-- Left Panel: File Upload + Queue -->
            <section class="left-panel">
                <div class="file-section">
                    <div class="file-section-title">📂 開啟檔案</div>
                    <div class="drop-zone-mini" id="dropZone">
                        <div class="drop-zone-mini-icon">📄</div>
                        <div class="drop-zone-mini-text">點擊或拖放檔案<br>JPG/PNG/PDF</div>
                    </div>
                    <div style="display:flex;gap:4px;margin-top:6px;">
                        <button class="btn btn-secondary" id="openFile" style="flex:1;font-size:9px;">📂 瀏覽</button>
                        <button class="btn btn-secondary" id="cameraCapture" style="flex:1;font-size:9px;">📷 相機</button>
                    </div>
                </div>

                <div class="queue-section">
                    <div class="queue-header">
                        <span>📋 待辨識清單</span>
                        <button class="btn btn-icon" id="clearQueue" title="清空" style="font-size:10px;">🗑</button>
                    </div>
                    <div class="queue-container" id="queueContainer">
                        <p style="color:var(--text-secondary);text-align:center;padding:15px;font-size:10px;">尚無待辨識項目</p>
                    </div>
                    <div class="queue-summary" id="queueSummary">總計: 0 個檔案, 0 頁</div>
                    <div class="queue-actions">
                        <button class="btn btn-secondary" id="addToQueue" style="flex:1;font-size:9px;">+ 加入</button>
                        <button class="btn btn-primary" id="processQueue" style="flex:1;font-size:9px;">▶ 全部辨識</button>
                    </div>
                </div>
            </section>

            <!-- Center Panel: Image Preview -->
            <section class="center-panel">
                <div class="image-toolbar">
                    <div class="toolbar-group">
                        <button class="btn btn-icon" id="rotateLeft" title="向左旋轉">↺</button>
                        <button class="btn btn-icon" id="rotateRight" title="向右旋轉">↻</button>
                        <button class="btn btn-icon" id="zoomIn" title="放大">🔍+</button>
                        <button class="btn btn-icon" id="zoomOut" title="縮小">🔍-</button>
                        <button class="btn btn-icon" id="zoomFit" title="適應">⊡</button>
                    </div>
                    <div class="toolbar-group">
                        <button class="btn btn-icon" id="selectRegion" title="框選區域">▢</button>
                        <button class="btn btn-icon" id="clearCurrent" title="移除目前">✕</button>
                    </div>
                </div>

                <div class="image-container" id="imageContainer">
                    <div class="no-image-hint" id="noImageHint">
                        <div style="font-size:36px;opacity:0.3;margin-bottom:8px;">🖼</div>
                        <div>請從左側上傳檔案</div>
                    </div>
                    <div class="image-wrapper" id="imageWrapper" style="display:none;">
                        <canvas id="imageCanvas"></canvas>
                    </div>
                    <div class="selection-box" id="selectionBox"></div>
                    <div class="zoom-indicator" id="zoomIndicator" style="display:none;">100%</div>
                    <div class="loading-overlay" id="imageLoading"><div class="spinner"></div><span>處理中...</span></div>
                </div>

                <!-- Page Selection Controls -->
                <div class="page-select-controls">
                    <span style="color:var(--text-secondary);">頁面選擇:</span>
                    <button class="page-select-btn" id="selectAll" title="全數指定">全選</button>
                    <button class="page-select-btn" id="selectNone" title="取消全選">全不選</button>
                    <button class="page-select-btn" id="autoSelect" title="自動辨識已勾選">自動辨識</button>
                    <span style="margin-left:auto;color:var(--text-secondary);" id="selectedCount">已選: 0</span>
                </div>

                <div class="thumbnails-bar" id="thumbnailsBar"></div>
            </section>

            <!-- Right Panel: Results -->
            <section class="right-panel">
                <div class="right-tabs">
                    <button class="right-tab active" data-tab="result">識別結果</button>
                    <button class="right-tab" data-tab="history">歷史記錄</button>
                </div>

                <div class="tab-content active" data-tab-content="result">
                    <div class="ocr-controls">
                        <div class="ocr-mode-row">
                            <button class="mode-btn active" data-mode="text">純文字</button>
                            <button class="mode-btn" data-mode="structured">結構化</button>
                            <button class="mode-btn" data-mode="table">表格</button>
                            <button class="mode-btn" data-mode="handwriting">手寫</button>

    <div class="toast-container" id="toastContainer"></div>
    <input type="file" id="fileInput" class="file-input" accept="image/*,.pdf" multiple>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/docx/8.2.0/docx.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

    <script>
    const state = {
        images: [],          // All loaded images
        currentIndex: -1,
        zoom: 1,
        rotation: 0,
        panX: 0,
        panY: 0,
        isPanning: false,
        panStart: { x: 0, y: 0 },
        isSelecting: false,
        selectionRect: null,
        currentMode: 'text',
        ocrScope: 'current',
        outputFormat: 'txt',
        settings: {
            apiEndpoint: 'http://localhost:1234/v1/chat/completions',
            model: 'qwen3-vl-8b-instruct',
            temperature: 0.1,
            maxTokens: 4096,
            maxResolution: 2048
        },
        queue: [],               // Queue items with file info
        currentQueueIndex: -1,
        selectedPages: new Set(), // Selected page indices for OCR
        results: {},
        history: [],
        lastResult: '',
        isOnline: false,
        pendingPdf: null,
        pdfCache: {},            // Cache PDF references (lazy loading)
        outputDirHandle: null
    };

    const $ = s => document.querySelector(s);
    const $$ = s => document.querySelectorAll(s);

    document.addEventListener('DOMContentLoaded', () => {
        loadSettings();
        loadHistory();
        setupEvents();
        checkConnection();
        refreshModels();
        setInterval(checkConnection, 30000);
    });

    function loadSettings() {
        const s = localStorage.getItem('qwen-ocr-settings');
        if (s) Object.assign(state.settings, JSON.parse(s));
        applySettings();
    }

    function applySettings() {
        $('#apiEndpoint').value = state.settings.apiEndpoint;
        $('#temperature').value = state.settings.temperature;
        $('#tempValue').textContent = state.settings.temperature;
        $('#maxTokens').value = state.settings.maxTokens;
        $('#maxTokensValue').textContent = state.settings.maxTokens;
        $('#maxResolution').value = state.settings.maxResolution;
        $('#headerModelSelect').value = state.settings.model;
    }

    function saveSettings() {
        state.settings.apiEndpoint = $('#apiEndpoint').value;
        state.settings.temperature = parseFloat($('#temperature').value);
        state.settings.maxTokens = parseInt($('#maxTokens').value);
        state.settings.maxResolution = parseInt($('#maxResolution').value);
        localStorage.setItem('qwen-ocr-settings', JSON.stringify(state.settings));
        toast('設定已儲存', 'success');
        $('#settingsModal').classList.remove('visible');
    }

    function setupEvents() {
        // File drop zone
        $('#dropZone').onclick = () => $('#fileInput').click();
        $('#dropZone').ondragover = e => { e.preventDefault(); $('#dropZone').classList.add('active'); };
        $('#dropZone').ondragleave = () => $('#dropZone').classList.remove('active');
        $('#dropZone').ondrop = e => { e.preventDefault(); $('#dropZone').classList.remove('active'); processFiles([...e.dataTransfer.files]); };
        $('#fileInput').onchange = e => { processFiles([...e.target.files]); e.target.value = ''; };
        document.onpaste = e => { for (const i of e.clipboardData.items) if (i.type.startsWith('image/')) { processFiles([i.getAsFile()]); break; } };

        $('#openFile').onclick = () => $('#fileInput').click();
        $('#cameraCapture').onclick = openCamera;
        $('#rotateLeft').onclick = () => rotate(-90);
        $('#rotateRight').onclick = () => rotate(90);
        $('#zoomIn').onclick = () => setZoom(state.zoom * 1.25);
        $('#zoomOut').onclick = () => setZoom(state.zoom * 0.8);
        $('#zoomFit').onclick = resetView;
        $('#selectRegion').onclick = toggleSelect;
        $('#clearCurrent').onclick = removeCurrent;

        // Pan events
        const w = $('#imageWrapper');
        w.onmousedown = startPan;
        document.onmousemove = doPan;
        document.onmouseup = endPan;
        $('#imageContainer').onwheel = e => { e.preventDefault(); setZoom(state.zoom * (e.deltaY > 0 ? 0.9 : 1.1)); };

        // Page selection controls
        $('#selectAll').onclick = selectAllPages;
        $('#selectNone').onclick = selectNoPages;
        $('#autoSelect').onclick = autoRecognize;

        // Tab switching
        $$('.right-tab').forEach(t => t.onclick = () => switchTab(t.dataset.tab));
        $$('.mode-btn').forEach(b => b.onclick = () => setMode(b.dataset.mode));
        $$('input[name="ocrScope"]').forEach(r => r.onchange = () => state.ocrScope = r.value);
        $('#outputFormat').onchange = e => state.outputFormat = e.target.value;

        // Result actions
        $('#copyResult').onclick = copyResult;
        $('#saveResult').onclick = saveManual;
        $('#clearResult').onclick = () => { state.lastResult = ''; $('#resultContent').innerHTML = '<span style="color:var(--text-secondary)">識別結果將顯示於此...</span>'; };
        $('#startOCR').onclick = startOCR;

        // Queue actions
        $('#addToQueue').onclick = addToQueue;
        $('#clearQueue').onclick = () => { if (state.queue.length && confirm('清空清單?')) { state.queue = []; state.currentQueueIndex = -1; renderQueue(); updateThumbnailsForQueue(); } };
        $('#processQueue').onclick = processAll;
        $('#clearHistory').onclick = clearHistory;

        // Settings
        $('#settingsBtn').onclick = () => $('#settingsModal').classList.add('visible');
        $('#closeSettings').onclick = () => $('#settingsModal').classList.remove('visible');
        $('#saveSettings').onclick = saveSettings;
        $('#resetSettings').onclick = () => {
            state.settings = { apiEndpoint: 'http://localhost:1234/v1/chat/completions', model: 'qwen3-vl-8b-instruct', temperature: 0.1, maxTokens: 4096, maxResolution: 2048 };
            applySettings();
            toast('已重設', 'success');
        };
        $('#temperature').oninput = e => $('#tempValue').textContent = e.target.value;
        $('#maxTokens').oninput = e => $('#maxTokensValue').textContent = e.target.value;
        $('#selectOutputFolder').onclick = selectFolder;
        $('#headerModelSelect').onchange = e => { state.settings.model = e.target.value; localStorage.setItem('qwen-ocr-settings', JSON.stringify(state.settings)); };
        $('#headerRefreshModels').onclick = refreshModels;

        // PDF modal
        $('#closePdfPage').onclick = $('#cancelPdfPage').onclick = () => $('#pdfPageModal').classList.remove('visible');
        $('#confirmPdfPages').onclick = confirmPdf;
        $('#pdfPageInput').oninput = validatePages;

        // Camera modal
        $('#closeCamera').onclick = $('#cancelCamera').onclick = closeCamera;
        $('#capturePhoto').onclick = capture;

        // Theme
        $('#themeToggle').onclick = () => { document.body.classList.toggle('light-theme'); localStorage.setItem('theme', document.body.classList.contains('light-theme') ? 'light' : 'dark'); };
        if (localStorage.getItem('theme') === 'light') document.body.classList.add('light-theme');

        // Keyboard shortcuts
        document.onkeydown = e => {
            if (e.ctrlKey && e.key === 'Enter') { e.preventDefault(); startOCR(); }
            if (e.key === 'Escape') $$('.modal-overlay').forEach(m => m.classList.remove('visible'));
        };
    }

    // ============ FILE PROCESSING ============

    async function processFiles(files) {
        $('#imageLoading').classList.add('visible');
        for (const f of files) {
            if (f.type === 'application/pdf') {
                await showPdfModal(f);
            } else if (f.type.startsWith('image/')) {
                await processImage(f);
            }
        }
        $('#imageLoading').classList.remove('visible');
        if (state.images.length && state.currentIndex === -1) selectImg(0);
    }

    async function processImage(file, pageNum = null, totalPages = null) {
        return new Promise(r => {
            const reader = new FileReader();
            reader.onload = e => {
                const img = new Image();
                img.onload = () => {
                    const c = preprocess(img);
                    state.images.push({
                        id: Date.now() + Math.random(),
                        canvas: c,
                        fileName: file.name,
                        rotation: 0,
                        thumbnail: thumb(c),
                        pageNum,
                        totalPages
                    });
                    renderThumbs();
                    $('#noImageHint').classList.add('hidden');
                    r();
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        });
    }

    function preprocess(img) {
        const c = document.createElement('canvas'), ctx = c.getContext('2d');
        let w = img.width, h = img.height;
        const m = state.settings.maxResolution;
        if (m > 0 && (w > m || h > m)) {
            const r = Math.min(m / w, m / h);
            w *= r;
            h *= r;
        }
        c.width = w;
        c.height = h;
        ctx.drawImage(img, 0, 0, w, h);
        return c;
    }

    function thumb(c) {
        const t = document.createElement('canvas'), ctx = t.getContext('2d');
        const r = Math.min(40 / c.width, 40 / c.height);
        t.width = c.width * r;
        t.height = c.height * r;
        ctx.drawImage(c, 0, 0, t.width, t.height);
        return t.toDataURL('image/jpeg', 0.6);
    }

    // ============ PDF LAZY LOADING ============

    async function showPdfModal(file) {
        // Only read page count, don't render pages yet
        const arrayBuffer = await file.arrayBuffer();
        const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;

        // Cache PDF reference for later use
        const pdfId = `pdf_${Date.now()}`;
        state.pdfCache[pdfId] = { pdf, file, arrayBuffer };
        state.pendingPdf = { pdfId, file, pdf };

        $('#pdfFileName').textContent = file.name;
        $('#pdfTotalPages').textContent = pdf.numPages;
        $('#pdfPageInput').value = `1-${pdf.numPages}`;
        validatePages();
        $('#imageLoading').classList.remove('visible');
        $('#pdfPageModal').classList.add('visible');
    }

    function parseRange(input, max) {
        const pages = new Set(), errors = [];
        input.split(',').map(s => s.trim()).filter(s => s).forEach(p => {
            if (p.includes('-')) {
                const [a, b] = p.split('-').map(s => parseInt(s.trim()));
                if (isNaN(a) || isNaN(b)) errors.push(`無效: ${p}`);
                else if (a < 1 || b > max) errors.push(`超出範圍: ${p}`);
                else if (a > b) errors.push(`起始>結束: ${p}`);
                else for (let i = a; i <= b; i++) pages.add(i);
            } else {
                const n = parseInt(p);
                if (isNaN(n)) errors.push(`無效: ${p}`);
                else if (n < 1 || n > max) errors.push(`超出: ${p}`);
                else pages.add(n);
            }
        });
        return { pages: [...pages].sort((a, b) => a - b), errors };
    }

    function validatePages() {
        const totalPages = state.pendingPdf?.pdf?.numPages || 1;
        const { pages, errors } = parseRange($('#pdfPageInput').value, totalPages);
        if (errors.length) {
            $('#pdfPageError').textContent = errors.join('; ');
            $('#pdfPageError').style.display = 'block';
            $('#pdfPagePreview').textContent = '';
        } else {
            $('#pdfPageError').style.display = 'none';
            $('#pdfPagePreview').textContent = pages.length ? `將載入 ${pages.length} 頁` : '';
        }
    }

    async function confirmPdf() {
        const totalPages = state.pendingPdf.pdf.numPages;
        const { pages, errors } = parseRange($('#pdfPageInput').value, totalPages);
        if (errors.length) { toast('頁面範圍有誤', 'error'); return; }
        if (!pages.length) { toast('請選擇頁面', 'error'); return; }

        $('#pdfPageModal').classList.remove('visible');
        $('#imageLoading').classList.add('visible');

        const { file, pdf, pdfId } = state.pendingPdf;
        try {
            // Add to queue with lazy loading info
            state.queue.push({
                id: Date.now() + Math.random(),
                fileName: file.name,
                pdfId: pdfId,
                pageRange: pages.join(','),
                pages: pages,
                totalPages: totalPages,
                loaded: false,     // Marks if pages are loaded into images array
                imageIndices: []   // Will store indices of loaded images
            });

            // Only load the first page for preview
            await loadPdfPage(pdfId, pages[0], file.name, totalPages);

            renderQueue();
            renderThumbs();
            $('#noImageHint').classList.add('hidden');

            if (state.currentIndex === -1) selectImg(0);
            toast(`已加入清單: ${file.name} (${pages.length} 頁)`, 'success');
        } catch (e) {
            toast('PDF 錯誤: ' + e.message, 'error');
        } finally {
            $('#imageLoading').classList.remove('visible');
            state.pendingPdf = null;
        }
    }

    async function loadPdfPage(pdfId, pageNum, fileName, totalPages) {
        const cached = state.pdfCache[pdfId];
        if (!cached) throw new Error('PDF not in cache');

        const page = await cached.pdf.getPage(pageNum);
        const vp = page.getViewport({ scale: 2 });
        const c = document.createElement('canvas');
        c.width = vp.width;
        c.height = vp.height;
        await page.render({ canvasContext: c.getContext('2d'), viewport: vp }).promise;

        const img = new Image();
        await new Promise(r => { img.onload = r; img.src = c.toDataURL('image/png'); });
        const proc = preprocess(img);

        const imgObj = {
            id: Date.now() + Math.random(),
            canvas: proc,
            fileName: fileName,
            pdfId: pdfId,
            rotation: 0,
            thumbnail: thumb(proc),
            pageNum: pageNum,
            totalPages: totalPages
        };

        state.images.push(imgObj);
        return state.images.length - 1;
    }

    async function loadPdfPagesOnDemand(queueItem) {
        // Load all pages for a queue item if not already loaded
        if (queueItem.loaded) return;

        $('#imageLoading').classList.add('visible');
        try {
            const existingIndices = state.images
                .map((img, idx) => img.fileName === queueItem.fileName && img.pdfId === queueItem.pdfId ? idx : -1)
                .filter(idx => idx >= 0);
            const loadedPages = existingIndices.map(idx => state.images[idx].pageNum);

            for (const pageNum of queueItem.pages) {
                if (!loadedPages.includes(pageNum)) {
                    const idx = await loadPdfPage(queueItem.pdfId, pageNum, queueItem.fileName, queueItem.totalPages);
                    existingIndices.push(idx);
                }
            }

            queueItem.loaded = true;
            queueItem.imageIndices = existingIndices;
            renderThumbs();
        } finally {
            $('#imageLoading').classList.remove('visible');
        }
    }

    // ============ IMAGE DISPLAY ============

    function selectImg(i) {
        if (i < 0 || i >= state.images.length) return;
        state.currentIndex = i;
        state.zoom = 1;
        state.panX = 0;
        state.panY = 0;
        state.rotation = state.images[i].rotation;
        renderImg();
        renderThumbs();
    }

    function renderImg() {
        if (state.currentIndex < 0) return;
        const d = state.images[state.currentIndex];
        const c = $('#imageCanvas'), ctx = c.getContext('2d'), src = d.canvas;
        const rot = state.rotation, rotated = rot === 90 || rot === 270;
        c.width = rotated ? src.height : src.width;
        c.height = rotated ? src.width : src.height;
        ctx.save();
        ctx.translate(c.width / 2, c.height / 2);
        ctx.rotate(rot * Math.PI / 180);
        ctx.drawImage(src, -src.width / 2, -src.height / 2);
        ctx.restore();

        const w = $('#imageWrapper');
        w.style.display = 'block';
        w.style.transform = `translate(calc(-50% + ${state.panX}px), calc(-50% + ${state.panY}px)) scale(${state.zoom})`;
        $('#zoomIndicator').textContent = Math.round(state.zoom * 100) + '%';
        $('#zoomIndicator').style.display = 'block';
        $('#imageInfo').textContent = `${c.width}×${c.height}${d.pageNum ? ` (${d.pageNum}/${d.totalPages})` : ''}`;
    }

    function renderThumbs() {
        const bar = $('#thumbnailsBar');
        bar.innerHTML = '';

        // Filter images based on selected queue item
        let imagesToShow = state.images;
        if (state.currentQueueIndex >= 0 && state.queue[state.currentQueueIndex]) {
            const q = state.queue[state.currentQueueIndex];
            imagesToShow = state.images.filter(img =>
                img.fileName === q.fileName &&
                (!q.pdfId || img.pdfId === q.pdfId)
            );
        }

        imagesToShow.forEach((img) => {
            const globalIndex = state.images.indexOf(img);
            const wrap = document.createElement('div');
            wrap.className = 'thumbnail-wrapper';

            const t = document.createElement('img');
            t.className = 'thumbnail';
            if (globalIndex === state.currentIndex) t.classList.add('active');
            if (state.selectedPages.has(globalIndex)) t.classList.add('selected');
            t.src = img.thumbnail;
            t.onclick = () => selectImg(globalIndex);

            // Checkbox for page selection
            const cb = document.createElement('input');
            cb.type = 'checkbox';
            cb.className = 'thumbnail-checkbox';
            cb.checked = state.selectedPages.has(globalIndex);
            cb.onclick = e => {
                e.stopPropagation();
                if (cb.checked) state.selectedPages.add(globalIndex);
                else state.selectedPages.delete(globalIndex);
                updateSelectedCount();
                renderThumbs();
            };

            wrap.appendChild(cb);
            wrap.appendChild(t);

            if (img.pageNum) {
                const p = document.createElement('div');
                p.className = 'page-indicator';
                p.textContent = img.pageNum;
                wrap.appendChild(p);
            }
            bar.appendChild(wrap);
        });

        updateSelectedCount();
    }

    function updateSelectedCount() {
        $('#selectedCount').textContent = `已選: ${state.selectedPages.size}`;
    }

    function removeCurrent() {
        if (state.currentIndex < 0) return;
        state.selectedPages.delete(state.currentIndex);
        state.images.splice(state.currentIndex, 1);

        if (!state.images.length) {
            state.currentIndex = -1;
            resetView();
            $('#noImageHint').classList.remove('hidden');
            $('#imageWrapper').style.display = 'none';
            $('#thumbnailsBar').innerHTML = '';
        } else if (state.currentIndex >= state.images.length) {
            selectImg(state.images.length - 1);
        } else {
            selectImg(Math.min(state.currentIndex, state.images.length - 1));
        }
        renderThumbs();
    }

    function rotate(deg) {
        if (state.currentIndex < 0) return;
        state.rotation = (state.rotation + deg + 360) % 360;
        state.images[state.currentIndex].rotation = state.rotation;
        renderImg();
    }

    function setZoom(z) {
        state.zoom = Math.max(0.25, Math.min(5, z));
        renderImg();
    }

    function resetView() {
        state.zoom = 1;
        state.panX = 0;
        state.panY = 0;
        if (state.currentIndex >= 0) renderImg();
    }

    function startPan(e) {
        if (state.isSelecting) return;
        state.isPanning = true;
        state.panStart = { x: e.clientX - state.panX, y: e.clientY - state.panY };
        $('#imageWrapper').classList.add('dragging');
    }

    function doPan(e) {
        if (!state.isPanning) return;
        state.panX = e.clientX - state.panStart.x;
        state.panY = e.clientY - state.panStart.y;
        $('#imageWrapper').style.transform = `translate(calc(-50% + ${state.panX}px), calc(-50% + ${state.panY}px)) scale(${state.zoom})`;
    }

    function endPan() {
        state.isPanning = false;
        $('#imageWrapper').classList.remove('dragging');
    }

    function toggleSelect() {
        state.isSelecting = !state.isSelecting;
        $('#imageCanvas').style.cursor = state.isSelecting ? 'crosshair' : 'grab';
        $('#selectRegion').classList.toggle('active', state.isSelecting);
    }

    // ============ PAGE SELECTION CONTROLS ============

    function selectAllPages() {
        let imagesToSelect = state.images;
        if (state.currentQueueIndex >= 0 && state.queue[state.currentQueueIndex]) {
            const q = state.queue[state.currentQueueIndex];
            imagesToSelect = state.images.filter(img =>
                img.fileName === q.fileName && (!q.pdfId || img.pdfId === q.pdfId)
            );
        }
        imagesToSelect.forEach(img => {
            state.selectedPages.add(state.images.indexOf(img));
        });
        renderThumbs();
        toast('已全選', 'success');
    }

    function selectNoPages() {
        let imagesToDeselect = state.images;
        if (state.currentQueueIndex >= 0 && state.queue[state.currentQueueIndex]) {
            const q = state.queue[state.currentQueueIndex];
            imagesToDeselect = state.images.filter(img =>
                img.fileName === q.fileName && (!q.pdfId || img.pdfId === q.pdfId)
            );
        }
        imagesToDeselect.forEach(img => {
            state.selectedPages.delete(state.images.indexOf(img));
        });
        renderThumbs();
        toast('已取消全選', 'info');
    }

    async function autoRecognize() {
        if (state.selectedPages.size === 0) {
            toast('請先勾選要辨識的頁面', 'error');
            return;
        }

        const indices = [...state.selectedPages].sort((a, b) => a - b);
        await ocrMultiplePages(indices);
    }

    // ============ QUEUE MANAGEMENT ============

    function addToQueue() {
        if (!state.images.length) {
            toast('請先上傳檔案', 'error');
            return;
        }

        // Group images by fileName
        const groups = {};
        state.images.forEach((img, i) => {
            const k = img.fileName;
            if (!groups[k]) {
                groups[k] = {
                    fileName: k,
                    pdfId: img.pdfId,
                    pages: [],
                    totalPages: img.totalPages || 1
                };
            }
            groups[k].pages.push({ index: i, pageNum: img.pageNum || 1 });
        });

        Object.values(groups).forEach(g => {
            // Check if already in queue
            if (!state.queue.find(q => q.fileName === g.fileName && q.pdfId === g.pdfId)) {
                state.queue.push({
                    id: Date.now() + Math.random(),
                    fileName: g.fileName,
                    pdfId: g.pdfId,
                    pageRange: g.pages.map(p => p.pageNum).join(','),
                    pages: g.pages.map(p => p.pageNum),
                    totalPages: g.totalPages,
                    loaded: true,
                    imageIndices: g.pages.map(p => p.index)
                });
            }
        });

        renderQueue();
        toast('已加入清單', 'success');
    }

    function renderQueue() {
        const c = $('#queueContainer');
        if (!state.queue.length) {
            c.innerHTML = '<p style="color:var(--text-secondary);text-align:center;padding:15px;font-size:10px;">尚無待辨識項目</p>';
            $('#queueSummary').textContent = '總計: 0 個檔案, 0 頁';
            return;
        }

        let total = 0;
        c.innerHTML = state.queue.map((q, i) => {
            const pageCount = q.pages ? q.pages.length : 0;
            total += pageCount;
            return `<div class="queue-item${state.currentQueueIndex === i ? ' active' : ''}" data-i="${i}">
                <div class="queue-item-header" onclick="selectQueue(${i})">
                    <span class="queue-item-name">${i + 1}. 📄 ${q.fileName}</span>
                    <div class="queue-item-actions">
                        <button onclick="event.stopPropagation();moveQueue(${i},-1)">▲</button>
                        <button onclick="event.stopPropagation();moveQueue(${i},1)">▼</button>
                        <button onclick="event.stopPropagation();removeQueue(${i})">✕</button>
                    </div>
                </div>
                <div class="queue-item-body">
                    <div class="queue-page-info">${pageCount} 頁 / 總 ${q.totalPages} 頁${q.loaded ? '' : ' (未載入)'}</div>
                </div>
            </div>`;
        }).join('');
        $('#queueSummary').textContent = `總計: ${state.queue.length} 個檔案, ${total} 頁`;
    }

    function updateThumbnailsForQueue() {
        renderThumbs();
    }

    window.selectQueue = async function(i) {
        state.currentQueueIndex = i;
        renderQueue();

        const q = state.queue[i];
        if (!q) return;

        // Load pages on demand if not loaded
        if (!q.loaded && q.pdfId) {
            await loadPdfPagesOnDemand(q);
        }

        // Show thumbnails for this file only
        renderThumbs();

        // Select first image of this file
        const firstImg = state.images.find(m =>
            m.fileName === q.fileName && (!q.pdfId || m.pdfId === q.pdfId)
        );
        if (firstImg) selectImg(state.images.indexOf(firstImg));
    };

    window.moveQueue = function(i, d) {
        const n = i + d;
        if (n < 0 || n >= state.queue.length) return;
        [state.queue[i], state.queue[n]] = [state.queue[n], state.queue[i]];
        if (state.currentQueueIndex === i) state.currentQueueIndex = n;
        else if (state.currentQueueIndex === n) state.currentQueueIndex = i;
        renderQueue();
    };

    window.removeQueue = function(i) {
        state.queue.splice(i, 1);
        if (state.currentQueueIndex >= state.queue.length) {
            state.currentQueueIndex = state.queue.length - 1;
        }
        renderQueue();
        renderThumbs();
    };

    // ============ OCR PROCESSING ============

    async function startOCR() {
        if (!state.images.length) {
            toast('請先上傳圖片', 'error');
            return;
        }
        if (state.ocrScope === 'current') await ocrCurrent();
        else if (state.ocrScope === 'task') await ocrTask();
        else await processAll();
    }

    async function ocrCurrent() {
        if (state.currentIndex < 0) return;
        $('#resultLoading').classList.add('visible');
        $('#loadingText').textContent = '識別中...';
        const t0 = performance.now();
        try {
            const r = await callAPI($('#imageCanvas'));
            const img = state.images[state.currentIndex];
            state.lastResult = r;

            let html = '';
            if (img.pageNum) html += `<div class="result-page-header">--- 第 ${img.pageNum} 頁 ---</div>`;
            html += r;
            $('#resultContent').innerHTML = html;

            $('#processTime').textContent = `處理時間: ${((performance.now() - t0) / 1000).toFixed(2)}s`;
            saveHistory(r, img.fileName);
        } catch (e) {
            toast('識別失敗: ' + e.message, 'error');
        } finally {
            $('#resultLoading').classList.remove('visible');
        }
    }

    async function ocrTask() {
        const cur = state.images[state.currentIndex];
        if (!cur) return;

        // Load all pages for current file if it's a PDF
        const queueItem = state.queue.find(q => q.fileName === cur.fileName && q.pdfId === cur.pdfId);
        if (queueItem && !queueItem.loaded) {
            await loadPdfPagesOnDemand(queueItem);
        }

        const imgs = state.images.filter(m => m.fileName === cur.fileName && m.pdfId === cur.pdfId);
        const indices = imgs.map(img => state.images.indexOf(img));
        await ocrMultiplePages(indices, cur.fileName);
    }

    async function ocrMultiplePages(indices, fileName = null) {
        if (!indices.length) return;

        $('#resultLoading').classList.add('visible');
        const t0 = performance.now();
        const results = [];
        const name = fileName || state.images[indices[0]]?.fileName || 'unknown';

        // Clear result area and show file header immediately
        $('#resultContent').innerHTML = `<div class="result-file-header">📄 ${name}</div>`;

        try {
            for (let i = 0; i < indices.length; i++) {
                const idx = indices[i];
                const img = state.images[idx];
                if (!img) continue;

                selectImg(idx);
                await delay(100);

                $('#loadingText').textContent = `識別 ${i + 1}/${indices.length}...`;
                $('#progressFill').style.width = `${((i + 1) / indices.length) * 100}%`;

                const r = await callAPI($('#imageCanvas'));
                results.push({ pageNum: img.pageNum || (i + 1), text: r });

                // Progressive display: append result immediately after each page
                const pageHeader = document.createElement('div');
                pageHeader.className = 'result-page-header';
                pageHeader.textContent = `--- 第 ${img.pageNum || (i + 1)} 頁 ---`;

                const pageContent = document.createElement('div');
                pageContent.textContent = r;

                $('#resultContent').appendChild(pageHeader);
                $('#resultContent').appendChild(pageContent);

                // Scroll to bottom to show new content
                $('#resultContent').scrollTop = $('#resultContent').scrollHeight;
            }

            state.results[name] = results;
            state.lastResult = results.map(r => `--- 第 ${r.pageNum} 頁 ---\n${r.text}`).join('\n\n');

            await autoSave(name, results);

            $('#processTime').textContent = `處理時間: ${((performance.now() - t0) / 1000).toFixed(2)}s`;
            toast('識別完成', 'success');
            saveHistory(state.lastResult, name);
        } catch (e) {
            toast('識別失敗: ' + e.message, 'error');
        } finally {
            $('#resultLoading').classList.remove('visible');
            $('#progressFill').style.width = '0%';
        }
    }

    async function processAll() {
        if (!state.queue.length) {
            toast('清單為空', 'error');
            return;
        }

        $('#resultLoading').classList.add('visible');
        const t0 = performance.now();
        const all = {};

        // Clear result area
        $('#resultContent').innerHTML = '';

        try {
            for (let qi = 0; qi < state.queue.length; qi++) {
                const q = state.queue[qi];

                // Load pages on demand
                if (!q.loaded && q.pdfId) {
                    await loadPdfPagesOnDemand(q);
                }

                const imgs = state.images.filter(m =>
                    m.fileName === q.fileName &&
                    (!q.pdfId || m.pdfId === q.pdfId) &&
                    q.pages.includes(m.pageNum || 1)
                );

                if (!imgs.length) continue;

                // Add file header
                const fileHeader = document.createElement('div');
                fileHeader.className = 'result-file-header';
                fileHeader.textContent = `📄 ${q.fileName}`;
                $('#resultContent').appendChild(fileHeader);

                $('#loadingText').textContent = `處理 ${qi + 1}/${state.queue.length}: ${q.fileName}`;

                const results = [];
                for (let pi = 0; pi < imgs.length; pi++) {
                    const img = imgs[pi];
                    selectImg(state.images.indexOf(img));
                    await delay(100);

                    $('#progressFill').style.width = `${((qi + pi / imgs.length) / state.queue.length) * 100}%`;

                    const r = await callAPI($('#imageCanvas'));
                    results.push({ pageNum: img.pageNum || (pi + 1), text: r });

                    // Progressive display
                    const pageHeader = document.createElement('div');
                    pageHeader.className = 'result-page-header';
                    pageHeader.textContent = `--- 第 ${img.pageNum || (pi + 1)} 頁 ---`;

                    const pageContent = document.createElement('div');
                    pageContent.textContent = r;

                    $('#resultContent').appendChild(pageHeader);
                    $('#resultContent').appendChild(pageContent);
                    $('#resultContent').scrollTop = $('#resultContent').scrollHeight;
                }

                all[q.fileName] = results;
                await autoSave(q.fileName, results);
            }

            state.results = all;

            // Build lastResult for copy function
            let txt = '';
            Object.entries(all).forEach(([name, results]) => {
                txt += `\n${'='.repeat(40)}\n📄 ${name}\n${'='.repeat(40)}\n\n`;
                results.forEach(r => {
                    txt += `--- 第 ${r.pageNum} 頁 ---\n${r.text}\n\n`;
                });
            });
            state.lastResult = txt;

            $('#processTime').textContent = `處理時間: ${((performance.now() - t0) / 1000).toFixed(2)}s`;
            toast('全部識別完成', 'success');
        } catch (e) {
            toast('識別失敗: ' + e.message, 'error');
        } finally {
            $('#resultLoading').classList.remove('visible');
            $('#progressFill').style.width = '0%';
        }
    }

    async function callAPI(canvas) {
        const b64 = canvas.toDataURL('image/jpeg', 0.85).split(',')[1];
        const prompts = {
            text: '請識別圖片中所有文字，保持原始排版。只輸出文字。',
            structured: '識別圖片文字並以 Markdown 格式輸出。',
            table: '識別圖片中表格並轉為 Markdown 表格。',
            handwriting: '識別手寫文字，不確定的用 [?] 標記。',
            multilang: '識別圖片中所有語言的文字。',
            custom: $('#customPrompt').value || '識別圖片中的文字。'
        };
        const res = await fetch(state.settings.apiEndpoint, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                model: state.settings.model,
                messages: [{ role: 'user', content: [
                    { type: 'image_url', image_url: { url: `data:image/jpeg;base64,${b64}` } },
                    { type: 'text', text: prompts[state.currentMode] }
                ]}],
                temperature: state.settings.temperature,
                max_tokens: state.settings.maxTokens
            })
        });
        if (!res.ok) throw new Error(`API 錯誤: ${res.status}`);
        return (await res.json()).choices[0].message.content;
    }

    // ============ OUTPUT & SAVE ============

    function timestamp() {
        const d = new Date();
        return `${d.getDate().toString().padStart(2,'0')}${(d.getMonth()+1).toString().padStart(2,'0')}${d.getFullYear()}_${d.getHours().toString().padStart(2,'0')}${d.getMinutes().toString().padStart(2,'0')}`;
    }

    function formatOutput(results, fmt, name) {
        const txt = results.map(r => `--- 第 ${r.pageNum} 頁 ---\n${r.text}`).join('\n\n');
        if (fmt === 'txt') return txt;
        if (fmt === 'md') return `# OCR: ${name}\n\n` + results.map(r => `## 第 ${r.pageNum} 頁\n\n${r.text}`).join('\n\n');
        if (fmt === 'json') return JSON.stringify({ fileName: name, timestamp: new Date().toISOString(), pages: results }, null, 2);
        return txt;
    }

    async function createDocx(results, name) {
        const { Document, Paragraph, TextRun, HeadingLevel, Packer } = docx;
        const children = [new Paragraph({ text: `OCR: ${name}`, heading: HeadingLevel.HEADING_1 })];
        results.forEach(r => {
            children.push(new Paragraph({ text: `第 ${r.pageNum} 頁`, heading: HeadingLevel.HEADING_2 }));
            r.text.split('\n').forEach(l => children.push(new Paragraph({ children: [new TextRun(l)] })));
        });
        return await Packer.toBlob(new Document({ sections: [{ children }] }));
    }

    function createXlsx(results) {
        const data = [['頁碼', '內容']];
        results.forEach(r => data.push([r.pageNum, r.text]));
        const ws = XLSX.utils.aoa_to_sheet(data);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, 'OCR');
        return new Blob([XLSX.write(wb, { bookType: 'xlsx', type: 'array' })], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
    }

    async function autoSave(fileName, results) {
        const fmt = state.outputFormat, ts = timestamp();
        const base = fileName.replace(/\.[^/.]+$/, '');
        const outName = `OCR_${base}_${ts}.${fmt}`;
        try {
            if (!state.outputDirHandle) {
                state.outputDirHandle = await window.showDirectoryPicker({ startIn: 'desktop', mode: 'readwrite' });
            }
            const fh = await state.outputDirHandle.getFileHandle(outName, { create: true });
            const w = await fh.createWritable();
            if (fmt === 'docx') await w.write(await createDocx(results, fileName));
            else if (fmt === 'xlsx') await w.write(createXlsx(results));
            else await w.write(formatOutput(results, fmt, fileName));
            await w.close();
            toast(`已儲存: ${outName}`, 'success');
        } catch (e) {
            if (e.name !== 'AbortError') {
                // Fallback to download
                const content = fmt === 'docx' ? await createDocx(results, fileName) :
                               (fmt === 'xlsx' ? createXlsx(results) : formatOutput(results, fmt, fileName));
                download(content, outName);
            }
        }
    }

    async function saveManual() {
        if (!state.lastResult) {
            toast('無內容可儲存', 'error');
            return;
        }
        const fmt = state.outputFormat, ts = timestamp();
        const name = `OCR_manual_${ts}.${fmt}`;
        const results = [{ pageNum: state.images[state.currentIndex]?.pageNum || 1, text: state.lastResult }];
        try {
            if (fmt === 'docx') download(await createDocx(results, 'manual'), name);
            else if (fmt === 'xlsx') download(createXlsx(results), name);
            else download(formatOutput(results, fmt, 'manual'), name);
            toast('已下載', 'success');
        } catch (e) {
            toast('儲存失敗', 'error');
        }
    }

    function download(content, name) {
        const blob = content instanceof Blob ? content : new Blob([content], { type: 'text/plain' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = name;
        a.click();
        URL.revokeObjectURL(a.href);
    }

    async function selectFolder() {
        try {
            state.outputDirHandle = await window.showDirectoryPicker({ mode: 'readwrite' });
            toast('已選擇輸出資料夾', 'success');
        } catch (e) {
            if (e.name !== 'AbortError') toast('選擇失敗', 'error');
        }
    }

    // ============ UTILITIES ============

    function setMode(m) {
        state.currentMode = m;
        $$('.mode-btn').forEach(b => b.classList.toggle('active', b.dataset.mode === m));
    }

    function switchTab(t) {
        $$('.right-tab').forEach(r => r.classList.toggle('active', r.dataset.tab === t));
        $$('.tab-content').forEach(c => c.classList.toggle('active', c.dataset.tabContent === t));
    }

    function copyResult() {
        if (!state.lastResult) {
            toast('無內容', 'error');
            return;
        }
        navigator.clipboard.writeText(state.lastResult).then(() => toast('已複製', 'success'));
    }

    function toast(msg, type = 'info') {
        const t = document.createElement('div');
        t.className = `toast ${type}`;
        t.textContent = msg;
        $('#toastContainer').appendChild(t);
        setTimeout(() => {
            t.style.opacity = '0';
            setTimeout(() => t.remove(), 300);
        }, 3000);
    }

    function delay(ms) { return new Promise(r => setTimeout(r, ms)); }

    function loadHistory() {
        const s = localStorage.getItem('qwen-ocr-history');
        if (s) state.history = JSON.parse(s);
    }

    function saveHistory(r, name) {
        state.history.unshift({
            id: Date.now(),
            result: r.substring(0, 500),
            fileName: name,
            timestamp: new Date().toISOString()
        });
        state.history = state.history.slice(0, 30);
        localStorage.setItem('qwen-ocr-history', JSON.stringify(state.history));
    }

    function clearHistory() {
        if (confirm('清除歷史?')) {
            state.history = [];
            localStorage.removeItem('qwen-ocr-history');
            $('#historyContent').innerHTML = '<p style="color:var(--text-secondary);text-align:center;">暫無歷史記錄</p>';
        }
    }

    // ============ CAMERA ============

    let camStream = null;

    async function openCamera() {
        try {
            camStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
            $('#cameraVideo').srcObject = camStream;
            $('#cameraModal').classList.add('visible');
        } catch {
            toast('無法存取攝影機', 'error');
        }
    }

    function closeCamera() {
        if (camStream) {
            camStream.getTracks().forEach(t => t.stop());
            camStream = null;
        }
        $('#cameraModal').classList.remove('visible');
    }

    function capture() {
        const v = $('#cameraVideo'), c = document.createElement('canvas');
        c.width = v.videoWidth;
        c.height = v.videoHeight;
        c.getContext('2d').drawImage(v, 0, 0);
        c.toBlob(b => processFiles([new File([b], 'camera.jpg', { type: 'image/jpeg' })]), 'image/jpeg', 0.9);
        closeCamera();
    }

    // ============ CONNECTION ============

    async function checkConnection() {
        try {
            const r = await fetch(state.settings.apiEndpoint.replace('/chat/completions', '/models'), { signal: AbortSignal.timeout(5000) });
            state.isOnline = r.ok;
        } catch {
            state.isOnline = false;
        }
        $('#connectionStatus').classList.toggle('online', state.isOnline);
        $('#connectionStatus').classList.toggle('offline', !state.isOnline);
        $('#connectionText').textContent = state.isOnline ? 'API 已連線' : 'API 離線';
    }

    async function refreshModels() {
        try {
            const r = await fetch(state.settings.apiEndpoint.replace('/chat/completions', '/models'), { signal: AbortSignal.timeout(5000) });
            const d = await r.json();
            const s = $('#headerModelSelect');
            s.innerHTML = '<option value="qwen3-vl-8b-instruct">Qwen3-VL-8B</option>';
            if (d.data) {
                d.data.forEach(m => {
                    if (m.id !== 'qwen3-vl-8b-instruct') {
                        s.innerHTML += `<option value="${m.id}">${m.id}</option>`;
                    }
                });
            }
            s.value = state.settings.model;
        } catch {}
    }
    </script>
